<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <!-- Wichtig für Android Fullscreen und PWA-Verhalten -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Mal-App</title>
    <style>
        /* Grundlegendes Reset und Fullscreen-Setup */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* Verhindert langes Drücken und Markieren */
            -webkit-user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #ffffff;
            font-family: sans-serif;
            touch-action: none; /* Verhindert Scrollen beim Wischen */
        }

        /* Werkzeugleiste oben */
        #toolbar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background-color: #f0f0f0;
            display: flex;
            align-items: center;
            padding: 0 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 10;
            overflow-x: auto; /* Erlaubt wischen, falls der Bildschirm schmal ist */
        }

        /* Standard-Buttons für Farben und Werkzeuge */
        .btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            margin-right: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.9);
        }

        /* Der Button für den Farbwähler (Rainbow) */
        .color-picker-wrapper {
            position: relative;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin-right: 10px;
            background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red);
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            border: 4px solid #ffffff;
            flex-shrink: 0;
        }

        .color-picker-wrapper input[type="color"] {
            opacity: 0;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Spezifische Werkzeug-Buttons */
        #modeBtn {
            background-color: #4CAF50; /* Startet Grün (Malen) */
            margin-left: auto; /* Schiebt Werkzeuge nach rechts */
        }

        #trashBtn {
            background-color: #555555;
        }

        /* Canvas-Zeichenfläche */
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Eltern-Menü (versteckt) */
        #parentMenu {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0,0,0,0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .menu-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 90%;
        }

        .menu-box h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .menu-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background-color: #2196F3;
            color: white;
            font-weight: bold;
        }

        .menu-btn.close {
            background-color: #f44336;
        }

        /* SVG Icons */
        svg {
            width: 35px;
            height: 35px;
            stroke: white;
        }
    </style>
</head>
<body>

    <!-- Werkzeugleiste -->
    <div id="toolbar">
        <!-- Farbauswahl komplett (Regenbogen) -->
        <div class="color-picker-wrapper">
            <input type="color" id="customColor" value="#000000">
        </div>

        <!-- Vordefinierte Farben -->
        <div class="btn color-btn" style="background-color: #000000;" data-color="#000000"></div>
        <div class="btn color-btn" style="background-color: #2196F3;" data-color="#2196F3"></div>
        <div class="btn color-btn" style="background-color: #FFEB3B;" data-color="#FFEB3B"></div>
        <div class="btn color-btn" style="background-color: #4CAF50;" data-color="#4CAF50"></div>

        <!-- Modus wechseln (Malen / Radieren) -->
        <div class="btn" id="modeBtn">
            <!-- Stift Icon (Malen) -->
            <svg id="penIcon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
                <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
                <path d="M2 2l7.586 7.586"></path>
                <circle cx="11" cy="11" r="2"></circle>
            </svg>
            <!-- Radierer Icon (versteckt beim Start) -->
            <svg id="eraserIcon" style="display: none;" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 20H7L3 16C2.5 15.5 2.5 14.5 3 14L13 4C13.5 3.5 14.5 3.5 15 4L20 9C20.5 9.5 20.5 10.5 20 11L11 20H20V20Z"></path>
            </svg>
        </div>

        <!-- Mülleimer (Alles löschen) -->
        <div class="btn" id="trashBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"></path>
            </svg>
        </div>
    </div>

    <!-- Zeichenfläche -->
    <canvas id="canvas"></canvas>

    <!-- Verstecktes Elternmenü -->
    <div id="parentMenu">
        <div class="menu-box">
            <h2>Eltern-Optionen</h2>
            <button class="menu-btn" id="undoTrashBtn">Löschen rückgängig machen</button>
            <button class="menu-btn" id="clearDataBtn">Speicher (Cookies) leeren</button>
            <button class="menu-btn" id="printBtn">Kunstwerk drucken</button>
            <button class="menu-btn close" id="closeMenuBtn">Menü schließen</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        let isDrawing = false;
        let isEraser = false;
        let currentColor = '#000000';
        const lineWidth = 15; // Extra dick für Kinder
        
        // Canvas Größe anpassen
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            loadArtwork(); // Nach Größenänderung das Bild neu laden
        }
        window.addEventListener('resize', resizeCanvas);
        
        // Zeichen-Konfiguration
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // --- Speicher-Funktionen ---
        function saveArtwork() {
            localStorage.setItem('savedArtwork', canvas.toDataURL());
        }

        function loadArtwork() {
            const dataURL = localStorage.getItem('savedArtwork');
            if (dataURL) {
                const img = new Image();
                img.onload = () => {
                    ctx.drawImage(img, 0, 0);
                };
                img.src = dataURL;
            }
        }

        function saveUndoState() {
            localStorage.setItem('undoArtwork', canvas.toDataURL());
        }

        // --- Zeichen-Logik ---
        function getCoordinates(e) {
            if (e.touches && e.touches.length > 0) {
                return {
                    x: e.touches[0].clientX,
                    y: e.touches[0].clientY
                };
            }
            return {
                x: e.clientX,
                y: e.clientY
            };
        }

        function startPosition(e) {
            // Ignoriere Multitouch zum Zeichnen (verhindert wilde Striche bei 5-Finger-Tap)
            if (e.touches && e.touches.length > 1) return; 
            
            isDrawing = true;
            draw(e);
        }

        function endPosition() {
            if (isDrawing) {
                isDrawing = false;
                ctx.beginPath();
                saveArtwork(); // Speichern wenn der Finger angehoben wird
            }
        }

        function draw(e) {
            if (!isDrawing) return;
            // PreventDefault verhindert, dass das Handy scrollt
            e.preventDefault(); 
            
            const pos = getCoordinates(e);

            ctx.lineWidth = lineWidth;
            if (isEraser) {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.strokeStyle = 'rgba(0,0,0,1)';
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = currentColor;
            }

            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mousemove', draw);

        canvas.addEventListener('touchstart', startPosition, { passive: false });
        canvas.addEventListener('touchend', endPosition);
        canvas.addEventListener('touchmove', draw, { passive: false });

        // --- Werkzeugleiste Logik ---
        
        // Vordefinierte Farben
        const colorBtns = document.querySelectorAll('.color-btn');
        colorBtns.forEach(btn => {
            // Touch und Click unterstützen
            const selectColor = () => {
                currentColor = btn.getAttribute('data-color');
                setDrawMode();
            };
            btn.addEventListener('click', selectColor);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); selectColor(); });
        });

        // Farbrad (Custom Color)
        const customColorInput = document.getElementById('customColor');
        customColorInput.addEventListener('input', (e) => {
            currentColor = e.target.value;
            setDrawMode();
        });

        // Malen / Radieren umschalten
        const modeBtn = document.getElementById('modeBtn');
        const penIcon = document.getElementById('penIcon');
        const eraserIcon = document.getElementById('eraserIcon');

        function setDrawMode() {
            isEraser = false;
            modeBtn.style.backgroundColor = '#4CAF50'; // Grün
            penIcon.style.display = 'block';
            eraserIcon.style.display = 'none';
        }

        function toggleMode() {
            isEraser = !isEraser;
            if (isEraser) {
                modeBtn.style.backgroundColor = '#f44336'; // Rot
                penIcon.style.display = 'none';
                eraserIcon.style.display = 'block';
            } else {
                setDrawMode();
            }
        }
        
        modeBtn.addEventListener('click', toggleMode);
        modeBtn.addEventListener('touchstart', (e) => { e.preventDefault(); toggleMode(); });

        // Mülleimer
        const trashBtn = document.getElementById('trashBtn');
        function clearCanvas() {
            saveUndoState(); // Speichern, falls es ein Versehen war
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            saveArtwork();
        }
        trashBtn.addEventListener('click', clearCanvas);
        trashBtn.addEventListener('touchstart', (e) => { e.preventDefault(); clearCanvas(); });


        // --- Eltern-Menü (5-Finger-Tap) ---
        const parentMenu = document.getElementById('parentMenu');

        window.addEventListener('touchstart', (e) => {
            // Wenn exakt 5 Finger (oder mehr) auf dem Bildschirm liegen
            if (e.touches.length >= 5) {
                parentMenu.style.display = 'flex';
            }
        });

        // Eltern-Menü Funktionen
        document.getElementById('closeMenuBtn').addEventListener('click', () => {
            parentMenu.style.display = 'none';
        });

        document.getElementById('clearDataBtn').addEventListener('click', () => {
            if(confirm('Wirklich alle gespeicherten Kunstwerke (Cookies/Speicher) endgültig löschen?')) {
                localStorage.removeItem('savedArtwork');
                localStorage.removeItem('undoArtwork');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                alert('Speicher geleert.');
                parentMenu.style.display = 'none';
            }
        });

        document.getElementById('undoTrashBtn').addEventListener('click', () => {
            const undoData = localStorage.getItem('undoArtwork');
            if (undoData) {
                const img = new Image();
                img.onload = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                    saveArtwork();
                };
                img.src = undoData;
                alert('Letztes Löschen wurde rückgängig gemacht.');
            } else {
                alert('Es gibt nichts, was rückgängig gemacht werden kann.');
            }
            parentMenu.style.display = 'none';
        });

        document.getElementById('printBtn').addEventListener('click', () => {
            parentMenu.style.display = 'none';
            // Kleines Timeout, damit sich das Menü schließt, bevor gedruckt wird
            setTimeout(() => {
                window.print();
            }, 500);
        });

        // Init beim ersten Laden
        resizeCanvas();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        
    </script>
</body>
</html>
