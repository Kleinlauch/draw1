<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#f0f0f0">
    <link rel="manifest" href="manifest.json">
    <title>Mal-App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #ffffff;
            font-family: sans-serif;
            touch-action: none;
        }

        /* Startbildschirm (Splash Screen) */
        #splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            color: #ff4081; /* Ein schönes Pink/Magenta für den Text */
            transition: opacity 0.5s ease;
        }

        #toolbar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background-color: #f0f0f0;
            display: flex;
            align-items: center;
            padding: 0 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 10;
            overflow-x: auto;
        }

        .btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            margin-right: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s, border-color 0.2s;
        }

        .btn:active {
            transform: scale(0.9);
        }

        /* Wenn eine Farbe aktiv ausgewählt ist */
        .active-btn {
            transform: scale(1.15);
            border-color: #333333;
        }

        /* Regenbogen Button Animation */
        @keyframes rainbowSpin {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .rainbow-btn {
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3, #ff0000);
            background-size: 200% 100%;
            animation: rainbowSpin 2s linear infinite;
        }

        #modeBtn {
            background-color: #4CAF50;
            margin-left: auto;
        }

        #trashBtn {
            background-color: #555555;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        #parentMenu {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0,0,0,0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .menu-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 90%;
        }

        .menu-box h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .menu-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background-color: #2196F3;
            color: white;
            font-weight: bold;
        }

        .menu-btn.close {
            background-color: #f44336;
        }

        svg {
            width: 30px;
            height: 30px;
            stroke: white;
        }
    </style>
</head>
<body>

    <!-- Startbildschirm -->
    <div id="splash">Marco liebt dich</div>

    <div id="toolbar">
        <!-- Farbauswahl -->
        <div class="btn color-btn active-btn" style="background-color: #000000;" data-color="#000000"></div>
        <div class="btn color-btn rainbow-btn" data-color="rainbow"></div>
        <div class="btn color-btn" style="background-color: #FFC0CB;" data-color="#FFC0CB"></div> <!-- Rosa -->
        <div class="btn color-btn" style="background-color: #FF69B4;" data-color="#FF69B4"></div> <!-- Pink -->
        <div class="btn color-btn" style="background-color: #FF00FF;" data-color="#FF00FF"></div> <!-- Magenta -->
        <div class="btn color-btn" style="background-color: #00E5FF;" data-color="#00E5FF"></div> <!-- Türkis -->
        <div class="btn color-btn" style="background-color: #8D6E63;" data-color="#8D6E63"></div> <!-- Braun -->
        <div class="btn color-btn" style="background-color: #FF9800;" data-color="#FF9800"></div> <!-- Orange -->
        <div class="btn color-btn" style="background-color: #FFEB3B;" data-color="#FFEB3B"></div> <!-- Gelb -->
        <div class="btn color-btn" style="background-color: #F44336;" data-color="#F44336"></div> <!-- Rot -->
        <div class="btn color-btn" style="background-color: #4CAF50;" data-color="#4CAF50"></div> <!-- Grün -->
        <div class="btn color-btn" style="background-color: #2196F3;" data-color="#2196F3"></div> <!-- Blau -->

        <!-- Malen / Radieren -->
        <div class="btn" id="modeBtn">
            <svg id="penIcon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
                <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
                <path d="M2 2l7.586 7.586"></path>
                <circle cx="11" cy="11" r="2"></circle>
            </svg>
            <svg id="eraserIcon" style="display: none;" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 20H7L3 16C2.5 15.5 2.5 14.5 3 14L13 4C13.5 3.5 14.5 3.5 15 4L20 9C20.5 9.5 20.5 10.5 20 11L11 20H20V20Z"></path>
            </svg>
        </div>

        <!-- Mülleimer -->
        <div class="btn" id="trashBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"></path>
            </svg>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <div id="parentMenu">
        <div class="menu-box">
            <h2>Eltern-Optionen</h2>
            <button class="menu-btn" id="undoTrashBtn">Löschen rückgängig machen</button>
            <button class="menu-btn" id="clearDataBtn">Speicher leeren</button>
            <button class="menu-btn" id="printBtn">Kunstwerk drucken</button>
            <button class="menu-btn close" id="closeMenuBtn">Menü schließen</button>
        </div>
    </div>

    <script>
        // Startbildschirm Logik (1 Sekunde anzeigen)
        window.addEventListener('load', () => {
            const splash = document.getElementById('splash');
            setTimeout(() => {
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                }, 500); // Wartet auf das Ende der Fade-Out Animation
            }, 1000);
        });

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        let isDrawing = false;
        let isEraser = false;
        let isRainbow = false;
        let currentColor = '#000000';
        let rainbowHue = 0;
        let lastPos = { x: 0, y: 0 };
        const lineWidth = 15;
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            loadArtwork();
        }
        window.addEventListener('resize', resizeCanvas);
        
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        function saveArtwork() {
            localStorage.setItem('savedArtwork', canvas.toDataURL());
        }

        function loadArtwork() {
            const dataURL = localStorage.getItem('savedArtwork');
            if (dataURL) {
                const img = new Image();
                img.onload = () => {
                    ctx.drawImage(img, 0, 0);
                };
                img.src = dataURL;
            }
        }

        function saveUndoState() {
            localStorage.setItem('undoArtwork', canvas.toDataURL());
        }

        function getCoordinates(e) {
            if (e.touches && e.touches.length > 0) {
                return {
                    x: e.touches[0].clientX,
                    y: e.touches[0].clientY
                };
            }
            return {
                x: e.clientX,
                y: e.clientY
            };
        }

        function startPosition(e) {
            if (e.touches && e.touches.length > 1) return; 
            
            isDrawing = true;
            lastPos = getCoordinates(e);
            
            ctx.beginPath();
            ctx.moveTo(lastPos.x, lastPos.y);
            
            // Einen einzelnen Punkt zeichnen, falls nur getippt wird
            ctx.lineWidth = lineWidth;
            if (isEraser) {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.strokeStyle = 'rgba(0,0,0,1)';
            } else if (isRainbow) {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = `hsl(${rainbowHue}, 100%, 50%)`;
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = currentColor;
            }
            ctx.lineTo(lastPos.x, lastPos.y);
            ctx.stroke();
        }

        function endPosition() {
            if (isDrawing) {
                isDrawing = false;
                saveArtwork();
            }
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault(); 
            
            const pos = getCoordinates(e);

            ctx.lineWidth = lineWidth;
            
            if (isEraser) {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.strokeStyle = 'rgba(0,0,0,1)';
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            } else if (isRainbow) {
                ctx.globalCompositeOperation = 'source-over';
                rainbowHue = (rainbowHue + 4) % 360; // Farbe langsam ändern
                ctx.strokeStyle = `hsl(${rainbowHue}, 100%, 50%)`;
                
                // Für den Farbwechsel muss der Pfad neu begonnen werden
                ctx.beginPath();
                ctx.moveTo(lastPos.x, lastPos.y);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = currentColor;
                // Bei normalen Farben führen wir den Pfad fort für glatte Linien (kein Abhacken)
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            }
            
            lastPos = pos;
        }

        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mousemove', draw);

        canvas.addEventListener('touchstart', startPosition, { passive: false });
        canvas.addEventListener('touchend', endPosition);
        canvas.addEventListener('touchmove', draw, { passive: false });
        
        // Farben und Markierung wechseln
        const colorBtns = document.querySelectorAll('.color-btn');
        function updateActiveButton(clickedBtn) {
            colorBtns.forEach(b => b.classList.remove('active-btn'));
            clickedBtn.classList.add('active-btn');
        }

        colorBtns.forEach(btn => {
            const selectColor = () => {
                updateActiveButton(btn);
                const colorVal = btn.getAttribute('data-color');
                if (colorVal === 'rainbow') {
                    isRainbow = true;
                } else {
                    isRainbow = false;
                    currentColor = colorVal;
                }
                setDrawMode();
            };
            btn.addEventListener('click', selectColor);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); selectColor(); });
        });

        const modeBtn = document.getElementById('modeBtn');
        const penIcon = document.getElementById('penIcon');
        const eraserIcon = document.getElementById('eraserIcon');

        function setDrawMode() {
            isEraser = false;
            modeBtn.style.backgroundColor = '#4CAF50';
            penIcon.style.display = 'block';
            eraserIcon.style.display = 'none';
        }

        function toggleMode() {
            isEraser = !isEraser;
            if (isEraser) {
                modeBtn.style.backgroundColor = '#f44336';
                penIcon.style.display = 'none';
                eraserIcon.style.display = 'block';
                // Markierung bei den Farben entfernen, da radiert wird
                colorBtns.forEach(b => b.classList.remove('active-btn'));
            } else {
                setDrawMode();
                // Die zuletzt genutzte Farbe wieder markieren
                const activeBtn = Array.from(colorBtns).find(b => 
                    (isRainbow && b.getAttribute('data-color') === 'rainbow') || 
                    (!isRainbow && b.getAttribute('data-color') === currentColor)
                );
                if(activeBtn) activeBtn.classList.add('active-btn');
            }
        }
        
        modeBtn.addEventListener('click', toggleMode);
        modeBtn.addEventListener('touchstart', (e) => { e.preventDefault(); toggleMode(); });

        const trashBtn = document.getElementById('trashBtn');
        function clearCanvas() {
            saveUndoState();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            saveArtwork();
        }
        trashBtn.addEventListener('click', clearCanvas);
        trashBtn.addEventListener('touchstart', (e) => { e.preventDefault(); clearCanvas(); });


        // --- Eltern-Menü mit 2 Sekunden Verzögerung ---
        const parentMenu = document.getElementById('parentMenu');
        let parentMenuTimer = null;
        let fiveFingersDown = false;

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length >= 5) {
                fiveFingersDown = true;
                clearTimeout(parentMenuTimer); // Timer sicherheitshalber zurücksetzen
                
                // Startet den 2-Sekunden Timer
                parentMenuTimer = setTimeout(() => {
                    if (fiveFingersDown) {
                        parentMenu.style.display = 'flex';
                    }
                }, 2000); 
            }
        });

        window.addEventListener('touchend', (e) => {
            // Sobald nicht mehr 5 Finger aufliegen, Timer stoppen
            if (e.touches.length < 5) {
                fiveFingersDown = false;
                clearTimeout(parentMenuTimer);
            }
        });

        window.addEventListener('touchcancel', () => {
            fiveFingersDown = false;
            clearTimeout(parentMenuTimer);
        });


        // Eltern-Menü Buttons
        document.getElementById('closeMenuBtn').addEventListener('click', () => {
            parentMenu.style.display = 'none';
        });

        document.getElementById('clearDataBtn').addEventListener('click', () => {
            if(confirm('Wirklich alle gespeicherten Kunstwerke endgültig löschen?')) {
                localStorage.removeItem('savedArtwork');
                localStorage.removeItem('undoArtwork');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                alert('Speicher geleert.');
                parentMenu.style.display = 'none';
            }
        });

        document.getElementById('undoTrashBtn').addEventListener('click', () => {
            const undoData = localStorage.getItem('undoArtwork');
            if (undoData) {
                const img = new Image();
                img.onload = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                    saveArtwork();
                };
                img.src = undoData;
                alert('Letztes Löschen wurde rückgängig gemacht.');
            } else {
                alert('Es gibt nichts, was rückgängig gemacht werden kann.');
            }
            parentMenu.style.display = 'none';
        });

        document.getElementById('printBtn').addEventListener('click', () => {
            parentMenu.style.display = 'none';
            setTimeout(() => {
                window.print();
            }, 500);
        });

        // Start
        resizeCanvas();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // Service Worker für Offline
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Error:', err));
            });
        }
    </script>
</body>
</html>
