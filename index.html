<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#f0f0f0">
    <link rel="manifest" href="manifest.json">
    <title>Mal-App</title>
    <style>
        /* Grundlegendes Layout */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #ffffff;
            font-family: sans-serif;
            touch-action: none;
        }

        /* Startbildschirm (Splash Screen) */
        #splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            color: #ff4081;
            transition: opacity 0.5s ease;
        }

        /* Sperrbildschirm (Lock Screen) */
        #lockOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0,0,0,0.9);
            z-index: 9000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            font-size: 40px;
            font-weight: bold;
            text-align: center;
            padding: 20px;
        }

        /* Zweigeteilte Werkzeugleiste für besseres Scrollen */
        #toolbar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background-color: #f0f0f0;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 10;
        }

        /* Scrollbarer Bereich für die Farben */
        #colorScrollArea {
            display: flex;
            align-items: center;
            height: 100%;
            flex-grow: 1;
            overflow-x: auto;
            padding: 0 10px;
            /* Versteckt den Scrollbalken, erlaubt aber Wischen */
            scrollbar-width: none; 
        }
        #colorScrollArea::-webkit-scrollbar {
            display: none;
        }

        /* Fester Bereich für die Werkzeuge rechts */
        #toolsArea {
            display: flex;
            align-items: center;
            height: 100%;
            flex-shrink: 0;
            padding: 0 10px;
            border-left: 2px solid #cccccc;
            background-color: #f0f0f0;
        }

        .btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            margin-right: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s, border-color 0.2s;
        }

        .btn:active {
            transform: scale(0.9);
        }

        .active-btn {
            transform: scale(1.15);
            border-color: #333333;
        }

        @keyframes rainbowSpin {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .rainbow-btn {
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3, #ff0000);
            background-size: 200% 100%;
            animation: rainbowSpin 2s linear infinite;
        }

        #modeBtn {
            background-color: #4CAF50;
        }

        #trashBtn {
            background-color: #555555;
            margin-right: 0; /* Letzter Button braucht kein Margin */
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        #parentMenu {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0,0,0,0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .menu-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 90%;
        }

        .menu-box h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .menu-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background-color: #2196F3;
            color: white;
            font-weight: bold;
        }

        .menu-btn.close {
            background-color: #f44336;
        }

        svg {
            width: 30px;
            height: 30px;
            stroke: white;
        }
    </style>
</head>
<body>

    <!-- Startbildschirm -->
    <div id="splash">Marco liebt dich</div>

    <!-- Sperrbildschirm -->
    <div id="lockOverlay">
        <div id="lockReason">Gesperrt</div>
    </div>

    <!-- Werkzeugleiste -->
    <div id="toolbar">
        <!-- Scrollbarer Bereich für alle Farben -->
        <div id="colorScrollArea">
            <div class="btn color-btn active-btn" style="background-color: #000000;" data-color="#000000"></div>
            <div class="btn color-btn rainbow-btn" data-color="rainbow"></div>
            <div class="btn color-btn" style="background-color: #FFC0CB;" data-color="#FFC0CB"></div>
            <div class="btn color-btn" style="background-color: #FF69B4;" data-color="#FF69B4"></div>
            <div class="btn color-btn" style="background-color: #FF00FF;" data-color="#FF00FF"></div>
            <div class="btn color-btn" style="background-color: #00E5FF;" data-color="#00E5FF"></div>
            <div class="btn color-btn" style="background-color: #8D6E63;" data-color="#8D6E63"></div>
            <div class="btn color-btn" style="background-color: #FF9800;" data-color="#FF9800"></div>
            <div class="btn color-btn" style="background-color: #FFEB3B;" data-color="#FFEB3B"></div>
            <div class="btn color-btn" style="background-color: #F44336;" data-color="#F44336"></div>
            <div class="btn color-btn" style="background-color: #4CAF50;" data-color="#4CAF50"></div>
            <div class="btn color-btn" style="background-color: #2196F3;" data-color="#2196F3"></div>
            <!-- Hier werden Gist-Farben dynamisch angehängt -->
            <div id="dynamicColors"></div>
        </div>

        <!-- Fester Bereich für Werkzeuge -->
        <div id="toolsArea">
            <div class="btn" id="modeBtn">
                <svg id="penIcon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
                    <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
                    <path d="M2 2l7.586 7.586"></path>
                    <circle cx="11" cy="11" r="2"></circle>
                </svg>
                <svg id="eraserIcon" style="display: none;" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 20H7L3 16C2.5 15.5 2.5 14.5 3 14L13 4C13.5 3.5 14.5 3.5 15 4L20 9C20.5 9.5 20.5 10.5 20 11L11 20H20V20Z"></path>
                </svg>
            </div>
            <div class="btn" id="trashBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"></path>
                </svg>
            </div>
        </div>
    </div>

    <!-- Zeichenfläche -->
    <canvas id="canvas"></canvas>

    <!-- Eltern-Menü -->
    <div id="parentMenu">
        <div class="menu-box">
            <h2>Eltern-Optionen</h2>
            <button class="menu-btn" id="undoTrashBtn">Löschen rückgängig machen</button>
            <button class="menu-btn" id="clearDataBtn">Speicher leeren</button>
            <button class="menu-btn" id="printBtn">Kunstwerk drucken</button>
            <button class="menu-btn close" id="closeMenuBtn">Menü schließen</button>
        </div>
    </div>

    <script>
        // --- 1. Startbildschirm Logik ---
        window.addEventListener('load', () => {
            const splash = document.getElementById('splash');
            setTimeout(() => {
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                }, 500);
            }, 1000);
        });

        // --- 2. Globale Variablen für Canvas und Zustand ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        let isDrawing = false;
        let isEraser = false;
        let isRainbow = false;
        let currentColor = '#000000';
        let rainbowHue = 0;
        let lastPos = { x: 0, y: 0 };
        const lineWidth = 15;
        let isLocked = false;
        let activeTouchId = null; // Für Handballenerkennung (Palm Rejection)
        
        // Canvas Größe initialisieren
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            loadArtwork();
        }
        window.addEventListener('resize', resizeCanvas);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // --- 3. Gist-Fernsteuerung & Offline-Speicher ---
        // Die Raw-URL ohne Commit-Hash lädt immer die aktuellste Version
        const gistUrl = 'https://gist.githubusercontent.com/Kleinlauch/305f300ae73a102e623b3148202af353/raw/command.txt';
        
        async function fetchGist() {
            // Nur fetchen, wenn eine Internetverbindung besteht
            if (!navigator.onLine) return; 
            
            try {
                // Ein Zeitstempel am Ende verhindert den Browser-Cache
                const response = await fetch(gistUrl + '?t=' + Date.now());
                if (!response.ok) return;
                const text = await response.text();
                processGist(text);
            } catch (e) {
                console.log("Fehler beim Abrufen des Gists:", e);
            }
        }

        function processGist(text) {
            const lines = text.split('\n').map(l => l.trim());
            const lockLine = lines[0] || 'unlock';
            const cmdLine = lines[1] || '-';
            const colorsLine = lines[2] || '';

            // Zeile 1: Lock / Unlock
            const ignoredLock = localStorage.getItem('ignoredLockState');
            if (lockLine.startsWith('lock')) {
                // Wenn dieser spezifische Sperr-Befehl bereits lokal per PIN entsperrt wurde, ignoriere ihn
                if (ignoredLock !== text) {
                    const reason = lockLine.split(';')[1] || 'Gesperrt';
                    showLock(reason);
                }
            } else {
                hideLock();
                localStorage.removeItem('ignoredLockState'); // Reset lokales Entsperren
            }

            // Zeile 2: Befehle ausführen
            const lastExecutedCmd = localStorage.getItem('lastExecutedCmd');
            if (cmdLine !== '-' && cmdLine !== lastExecutedCmd) {
                executeCommand(cmdLine);
                // Speichere, dass dieser Befehl ausgeführt wurde, um Wiederholungen zu vermeiden
                localStorage.setItem('lastExecutedCmd', cmdLine);
            } else if (cmdLine === '-') {
                // Wenn das Gist auf '-' zurückgesetzt wurde, mach die Funktion bereit für neue Befehle
                localStorage.setItem('lastExecutedCmd', '-');
            }

            // Zeile 3: Zusätzliche Farben
            const savedExtraColors = localStorage.getItem('savedExtraColors');
            if (colorsLine !== savedExtraColors) {
                localStorage.setItem('savedExtraColors', colorsLine);
                renderExtraColors(colorsLine);
            }

            // Speichere den kompletten Zustand für Offline-Starts
            localStorage.setItem('lastGistContent', text);
        }

        function executeCommand(cmd) {
            switch(cmd) {
                case 'menu': 
                    document.getElementById('parentMenu').style.display = 'flex'; 
                    break;
                case 'delete': 
                    clearCanvas(); 
                    break;
                case 'undo-delete': 
                    undoCanvas(); 
                    break;
                case 'print': 
                    window.print(); 
                    break;
            }
        }

        // Starte das Gist-Polling (alle 10 Sekunden)
        setInterval(fetchGist, 10000);
        
        // Beim Start einmal aus dem lokalen Speicher laden (Offline-Backup), dann online fetchen
        const offlineGistContent = localStorage.getItem('lastGistContent');
        if (offlineGistContent) {
            processGist(offlineGistContent);
        }
        fetchGist();

        // --- 4. Sperrbildschirm Funktionen ---
        const lockOverlay = document.getElementById('lockOverlay');
        const lockReasonText = document.getElementById('lockReason');

        function showLock(reason) {
            isLocked = true;
            lockReasonText.innerText = reason;
            lockOverlay.style.display = 'flex';
        }

        function hideLock() {
            isLocked = false;
            lockOverlay.style.display = 'none';
        }

        // --- 5. Dynamische Farben rendern ---
        function renderExtraColors(hexString) {
            const container = document.getElementById('dynamicColors');
            container.innerHTML = ''; // Alte dynamische Farben löschen
            container.style.display = 'flex';

            if (!hexString || hexString === '-') return;

            const colors = hexString.split(';');
            colors.forEach(color => {
                if (color.startsWith('#')) {
                    const btn = document.createElement('div');
                    btn.className = 'btn color-btn dynamic-color';
                    btn.style.backgroundColor = color;
                    btn.setAttribute('data-color', color);
                    container.appendChild(btn);

                    // Event Listener für die neu erstellten Buttons hinzufügen
                    const selectColor = () => {
                        updateActiveButton(btn);
                        isRainbow = false;
                        currentColor = color;
                        setDrawMode();
                    };
                    btn.addEventListener('click', selectColor);
                    btn.addEventListener('touchstart', (e) => { e.preventDefault(); selectColor(); });
                }
            });
        }

        // --- 6. Lokaler Speicher für Kunstwerke ---
        function saveArtwork() {
            localStorage.setItem('savedArtwork', canvas.toDataURL());
        }

        function loadArtwork() {
            const dataURL = localStorage.getItem('savedArtwork');
            if (dataURL) {
                const img = new Image();
                img.onload = () => {
                    ctx.drawImage(img, 0, 0);
                };
                img.src = dataURL;
            }
        }

        function saveUndoState() {
            localStorage.setItem('undoArtwork', canvas.toDataURL());
        }

        function clearCanvas() {
            saveUndoState();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            saveArtwork();
        }

        function undoCanvas() {
            const undoData = localStorage.getItem('undoArtwork');
            if (undoData) {
                const img = new Image();
                img.onload = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                    saveArtwork();
                };
                img.src = undoData;
                alert('Löschen rückgängig gemacht.');
            }
        }

        // --- 7. Zeichen-Logik & Handballenerkennung (Palm Rejection) ---
        function startPosition(e) {
            if (isLocked) return;
            
            if (e.type === 'touchstart') {
                // PALM REJECTION: Wenn mehrere Finger auf dem Display liegen (z.B. flache Hand),
                // nehmen wir immer den Finger als Zeichenstift, der als letztes aufgesetzt wurde.
                // So kann die Hand ruhen und der zweite Finger malt.
                const touch = e.changedTouches[e.changedTouches.length - 1];
                activeTouchId = touch.identifier;
                lastPos = { x: touch.clientX, y: touch.clientY };
                isDrawing = true;
            } else {
                lastPos = { x: e.clientX, y: e.clientY };
                isDrawing = true;
            }
            
            ctx.beginPath();
            ctx.moveTo(lastPos.x, lastPos.y);
            
            // Einzelnen Punkt beim ersten Tippen zeichnen
            ctx.lineWidth = lineWidth;
            if (isEraser) {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.strokeStyle = 'rgba(0,0,0,1)';
            } else if (isRainbow) {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = `hsl(${rainbowHue}, 100%, 50%)`;
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = currentColor;
            }
            ctx.lineTo(lastPos.x, lastPos.y);
            ctx.stroke();
        }

        function endPosition() {
            if (isDrawing) {
                isDrawing = false;
                saveArtwork();
            }
        }

        function draw(e) {
            if (!isDrawing || isLocked) return;
            e.preventDefault(); 
            
            let pos;
            if (e.type === 'touchmove') {
                // Suche genau den Finger, der als Zeichenstift identifiziert wurde
                const touch = Array.from(e.touches).find(t => t.identifier === activeTouchId);
                if (!touch) return; // Die aufliegende ruhende Hand wird ignoriert
                pos = { x: touch.clientX, y: touch.clientY };
            } else {
                pos = { x: e.clientX, y: e.clientY };
            }

            ctx.lineWidth = lineWidth;
            
            if (isEraser) {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.strokeStyle = 'rgba(0,0,0,1)';
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            } else if (isRainbow) {
                ctx.globalCompositeOperation = 'source-over';
                rainbowHue = (rainbowHue + 4) % 360; 
                ctx.strokeStyle = `hsl(${rainbowHue}, 100%, 50%)`;
                
                // Für flüssige Farbverläufe
                ctx.beginPath();
                ctx.moveTo(lastPos.x, lastPos.y);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = currentColor;
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            }
            
            lastPos = pos;
        }

        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mousemove', draw);

        canvas.addEventListener('touchstart', startPosition, { passive: false });
        canvas.addEventListener('touchend', endPosition);
        canvas.addEventListener('touchmove', draw, { passive: false });
        
        // --- 8. UI Interaktionen (Werkzeugleiste) ---
        function updateActiveButton(clickedBtn) {
            const allColors = document.querySelectorAll('.color-btn');
            allColors.forEach(b => b.classList.remove('active-btn'));
            clickedBtn.classList.add('active-btn');
        }

        // Standard-Farben initialisieren
        const colorBtns = document.querySelectorAll('.color-btn:not(.dynamic-color)');
        colorBtns.forEach(btn => {
            const selectColor = () => {
                updateActiveButton(btn);
                const colorVal = btn.getAttribute('data-color');
                if (colorVal === 'rainbow') {
                    isRainbow = true;
                } else {
                    isRainbow = false;
                    currentColor = colorVal;
                }
                setDrawMode();
            };
            btn.addEventListener('click', selectColor);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); selectColor(); });
        });

        const modeBtn = document.getElementById('modeBtn');
        const penIcon = document.getElementById('penIcon');
        const eraserIcon = document.getElementById('eraserIcon');

        function setDrawMode() {
            isEraser = false;
            modeBtn.style.backgroundColor = '#4CAF50';
            penIcon.style.display = 'block';
            eraserIcon.style.display = 'none';
        }

        function toggleMode() {
            isEraser = !isEraser;
            if (isEraser) {
                modeBtn.style.backgroundColor = '#f44336';
                penIcon.style.display = 'none';
                eraserIcon.style.display = 'block';
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active-btn'));
            } else {
                setDrawMode();
                const allColorBtns = document.querySelectorAll('.color-btn');
                const activeBtn = Array.from(allColorBtns).find(b => 
                    (isRainbow && b.getAttribute('data-color') === 'rainbow') || 
                    (!isRainbow && b.getAttribute('data-color') === currentColor)
                );
                if(activeBtn) activeBtn.classList.add('active-btn');
            }
        }
        
        modeBtn.addEventListener('click', toggleMode);
        modeBtn.addEventListener('touchstart', (e) => { e.preventDefault(); toggleMode(); });

        document.getElementById('trashBtn').addEventListener('click', clearCanvas);
        document.getElementById('trashBtn').addEventListener('touchstart', (e) => { e.preventDefault(); clearCanvas(); });


        // --- 9. Fünf-Finger Timer für Menü und Notfall-Entsperrung ---
        const parentMenu = document.getElementById('parentMenu');
        let parentMenuTimer = null;
        let fiveFingersDown = false;

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length >= 5) {
                fiveFingersDown = true;
                clearTimeout(parentMenuTimer); 
                
                if (isLocked) {
                    // Befindet sich das Gerät im Lock-Modus, läuft ein 3-Sekunden Timer für die PIN-Eingabe
                    parentMenuTimer = setTimeout(() => {
                        if (fiveFingersDown) {
                            const pin = prompt('Notfall-Entsperrung (PIN eingeben):');
                            if (pin === '1104') {
                                // Gist-Inhalt speichern, damit dieser exakte Sperrbefehl bis zur nächsten Änderung ignoriert wird
                                localStorage.setItem('ignoredLockState', localStorage.getItem('lastGistContent'));
                                hideLock();
                            }
                        }
                    }, 3000);
                } else {
                    // Befindet sich das Gerät im normalen Modus, öffnet sich nach 2 Sekunden das Menü
                    parentMenuTimer = setTimeout(() => {
                        if (fiveFingersDown) {
                            parentMenu.style.display = 'flex';
                        }
                    }, 2000); 
                }
            }
        });

        window.addEventListener('touchend', (e) => {
            if (e.touches.length < 5) {
                fiveFingersDown = false;
                clearTimeout(parentMenuTimer);
            }
        });

        window.addEventListener('touchcancel', () => {
            fiveFingersDown = false;
            clearTimeout(parentMenuTimer);
        });

        // --- 10. Eltern-Menü Buttons ---
        document.getElementById('closeMenuBtn').addEventListener('click', () => {
            parentMenu.style.display = 'none';
        });

        document.getElementById('clearDataBtn').addEventListener('click', () => {
            if(confirm('Wirklich alle gespeicherten Kunstwerke endgültig löschen?')) {
                localStorage.removeItem('savedArtwork');
                localStorage.removeItem('undoArtwork');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                alert('Speicher geleert.');
                parentMenu.style.display = 'none';
            }
        });

        document.getElementById('undoTrashBtn').addEventListener('click', () => {
            undoCanvas();
            parentMenu.style.display = 'none';
        });

        document.getElementById('printBtn').addEventListener('click', () => {
            parentMenu.style.display = 'none';
            setTimeout(() => { window.print(); }, 500);
        });

        // Init
        resizeCanvas();
        
        // Service Worker für den vollständigen Offline-Support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Error:', err));
            });
        }
    </script>
</body>
</html>
