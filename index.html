<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA & Fullscreen für Android Chrome (S25 Ultra) & iOS -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- App Icons -->
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    
    <title>Mal-App</title>
    
    <style>
        :root {
            --theme-color: #2196F3;
            --theme-bg: rgba(33, 150, 243, 0.15);
            --theme-glass: rgba(255, 255, 255, 0.85);
            --shadow-soft: 0 8px 24px rgba(0,0,0,0.12);
        }

        /* Reset & Layout */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
        body { width: 100vw; height: 100vh; overflow: hidden; background-color: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        img, canvas { -webkit-touch-callout: none; pointer-events: auto; }

        /* Splash Screen */
        #splash { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #ffffff; z-index: 9999; display: flex; justify-content: center; align-items: center; font-size: 36px; font-weight: 800; color: var(--theme-color); letter-spacing: 2px; transition: opacity 0.6s ease, transform 0.6s ease; }
        
        /* Fullscreen Overlays (Lock, Bedtime, Offline) */
        .fullscreen-lock { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(15, 15, 20, 0.95); z-index: 9000; justify-content: center; align-items: center; flex-direction: column; color: white; text-align: center; padding: 20px; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .lock-icon-svg { width: 80px; height: 80px; margin-bottom: 20px; stroke: white; stroke-width: 1.5; }
        .lock-text { font-size: 32px; font-weight: 800; letter-spacing: 1px; }
        .lock-subtext { font-size: 18px; color: #b0bec5; margin-top: 12px; }
        #bedtimeBypassBtn { position: absolute; top: max(20px, env(safe-area-inset-top)); right: 20px; padding: 12px 24px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.2); border-radius: 16px; color: white; font-weight: bold; z-index: 9001; cursor: pointer; transition: background 0.2s; }
        #bedtimeBypassBtn:active { background: rgba(255,255,255,0.2); }

        /* Bubbly Toolbar */
        #toolbar { position: absolute; top: env(safe-area-inset-top); left: 50%; transform: translateX(-50%); width: 96%; max-width: 1000px; height: 76px; margin-top: 12px; background-color: var(--theme-glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); display: flex; align-items: center; box-shadow: var(--shadow-soft); z-index: 10; border-radius: 38px; padding: 0 8px; border: 1px solid rgba(255,255,255,0.5); transition: opacity 0.3s, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .toolbar-hidden { transform: translate(-50%, -150%) !important; opacity: 0; pointer-events: none; }

        /* Areas inside Toolbar */
        #colorScrollArea { display: flex; align-items: center; height: 100%; flex-grow: 1; overflow-x: auto; overflow-y: hidden; padding: 0 8px; scrollbar-width: none; touch-action: pan-x; }
        #colorScrollArea::-webkit-scrollbar { display: none; }
        #toolsArea { display: flex; align-items: center; height: 100%; flex-shrink: 0; padding-left: 12px; border-left: 2px solid rgba(0,0,0,0.08); }

        /* Buttons */
        .btn { width: 52px; height: 52px; border-radius: 50%; border: 4px solid #ffffff; margin-right: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); flex-shrink: 0; display: flex; justify-content: center; align-items: center; transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s; cursor: pointer; background-color: #f1f3f5; }
        .btn:active { transform: scale(0.85); }
        .active-btn { transform: scale(1.15); border-color: #333333; box-shadow: 0 8px 16px rgba(0,0,0,0.2); }

        /* Spezifische Buttons */
        @keyframes rainbowSpin { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
        .rainbow-btn { background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3, #ff0000); background-size: 200% 100%; animation: rainbowSpin 3s linear infinite; }
        
        #modeBtn { background-color: #4CAF50; }
        #trashBtn { background-color: #f44336; border-color: #ffcdd2; margin-right: 0;}
        .undo-redo-btn { background-color: var(--theme-color); border-color: #e3f2fd; }
        .expert-btn { background-color: #9C27B0; border-color: #f3e5f5; display: none; }

        /* Mobile Color Button */
        #mobileColorBtn { display: none; background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red); border-color: #fff; }

        @media (max-width: 768px) {
            #colorScrollArea { display: none; } /* Scrollbereich auf dem Handy verstecken */
            #mobileColorBtn { display: flex; } /* Bunten Button zeigen */
            #toolbar { width: 90%; margin-top: max(10px, env(safe-area-inset-top)); }
        }

        /* Workspace & Canvas */
        #workspace { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; transform-origin: 0 0; z-index: 1; }
        #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: white; }
        .draggable-shape { position: absolute; transform: translate(-50%, -50%); z-index: 5; touch-action: none; filter: drop-shadow(0px 8px 16px rgba(0,0,0,0.25)); }
        .draggable-shape img { max-width: 300px; max-height: 300px; border-radius: 12px; pointer-events: none; } /* pointer-events none on img prevents ghost drag */

        /* Liquid Glass Menüs */
        .glass-menu { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(0,0,0,0.5); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); z-index: 9500; justify-content: center; align-items: center; flex-direction: column; opacity: 0; transition: opacity 0.3s ease; }
        .glass-menu.show { opacity: 1; }
        .menu-box { background: rgba(30, 32, 35, 0.85); border: 1px solid rgba(255,255,255,0.1); border-top: 1px solid rgba(255,255,255,0.2); border-radius: 32px; padding: 32px; text-align: center; width: 90%; max-width: 420px; box-shadow: 0 24px 48px rgba(0,0,0,0.4); color: white; display: flex; flex-direction: column; gap: 12px; max-height: 90vh; overflow-y: auto; scrollbar-width: none; }
        .menu-box::-webkit-scrollbar { display: none; }
        .menu-box h2 { margin-bottom: 8px; font-weight: 700; font-size: 24px; color: var(--theme-color); }
        
        .menu-btn { width: 100%; padding: 16px; font-size: 16px; border: none; border-radius: 16px; background-color: rgba(255,255,255,0.1); color: white; font-weight: 600; transition: all 0.2s; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .menu-btn:active { transform: scale(0.97); background-color: rgba(255,255,255,0.2); }
        .menu-btn.red { background-color: rgba(244, 67, 54, 0.2); color: #ff5252; border: 1px solid rgba(244, 67, 54, 0.3); }
        .menu-btn.blue { background-color: var(--theme-bg); border: 1px solid var(--theme-color); color: #ffffff; }

        /* Eingabefelder */
        .glass-input { width: 100%; padding: 16px; border-radius: 16px; border: 2px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.4); color: white; font-size: 18px; text-align: center; margin-bottom: 8px; outline: none; transition: border-color 0.3s; user-select: auto; -webkit-user-select: auto; font-family: inherit; }
        .glass-input:focus { border-color: var(--theme-color); }
        .row { display: flex; gap: 12px; }
        .row > * { flex: 1; }

        #logArea { background: rgba(0,0,0,0.4); padding: 12px; border-radius: 16px; font-family: monospace; font-size: 11px; text-align: left; height: 160px; overflow-y: auto; color: #69f0ae; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.05); }
        #logArea div { margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px dashed rgba(255,255,255,0.1); }

        select.glass-input { appearance: none; cursor: pointer; }
        input[type="color"].glass-input { padding: 4px; height: 56px; cursor: pointer; }
        
        .save-item { padding: 12px; background: rgba(255,255,255,0.08); border-radius: 16px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.05); }
        .save-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }

        /* Mobile Color Grid Picker */
        #mobileColorGrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; justify-items: center; }

        svg { width: 24px; height: 24px; stroke: white; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        .btn svg { filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }

        /* DRUCKEN (Nur Bild) */
        @media print {
            body * { visibility: hidden !important; }
            #workspace, #workspace * { visibility: visible !important; }
            #workspace { position: absolute !important; left: 0 !important; top: 0 !important; transform: none !important; width: 100% !important; height: 100% !important; }
            @page { margin: 0; size: auto; }
        }
    </style>
</head>

    <script>
        // --- Globale Variablen & Theme ---
        let appMode = localStorage.getItem('appMode') || 'einfach';
        let themeColor = localStorage.getItem('themeColor') || '#2196F3';
        
        let wsScale = 1, wsPanX = 0, wsPanY = 0;
        let isAppLocked = false, bedtimeBypassed = false;
        
        function applyTheme() {
            document.documentElement.style.setProperty('--theme-color', themeColor);
            // Theme Background with transparency (using substring hack for simple hex)
            document.documentElement.style.setProperty('--theme-bg', themeColor + '40'); 
            document.getElementById('themeColorInput').value = themeColor;
        }
        applyTheme();

        // --- Logger ---
        function appLog(msg) {
            let logs = JSON.parse(localStorage.getItem('appLogs') || '[]');
            logs.unshift(`[${new Date().toLocaleTimeString('de-DE')}] ${msg}`);
            if (logs.length > 50) logs.pop();
            localStorage.setItem('appLogs', JSON.stringify(logs));
            const logArea = document.getElementById('logArea');
            if(logArea) logArea.innerHTML = logs.map(l => `<div>${l}</div>`).join('');
        }

        // --- Keyboard Shortcuts für Dialoge ---
        function bindKeys(okBtnId, cancelBtnId) {
            const handler = (e) => {
                if(e.key === 'Enter') { e.preventDefault(); document.getElementById(okBtnId).click(); }
                if(e.key === 'Escape' && cancelBtnId) { e.preventDefault(); document.getElementById(cancelBtnId).click(); }
            };
            window.addEventListener('keydown', handler);
            return () => window.removeEventListener('keydown', handler);
        }

        // --- Custom Dialog Promises ---
        function showAlert(title, message, btnText = "OK") {
            return new Promise(resolve => {
                const modal = document.getElementById('customAlert');
                document.getElementById('caTitle').innerText = title;
                document.getElementById('caMessage').innerText = message;
                const okBtn = document.getElementById('caOk');
                okBtn.innerText = btnText;
                
                modal.style.display = 'flex';
                setTimeout(() => modal.classList.add('show'), 10);
                const unbind = bindKeys('caOk', null);
                
                okBtn.onclick = () => {
                    unbind();
                    modal.classList.remove('show');
                    setTimeout(() => { modal.style.display = 'none'; resolve(); }, 300);
                };
            });
        }

        function showConfirm(title, message, okText="Ja", cancelText="Nein") {
            return new Promise(resolve => {
                const modal = document.getElementById('customConfirm');
                document.getElementById('ccTitle').innerText = title;
                document.getElementById('ccMessage').innerText = message;
                document.getElementById('ccOk').innerText = okText;
                document.getElementById('ccCancel').innerText = cancelText;
                
                modal.style.display = 'flex';
                setTimeout(() => modal.classList.add('show'), 10);
                const unbind = bindKeys('ccOk', 'ccCancel');
                
                const close = (res) => { unbind(); modal.classList.remove('show'); setTimeout(() => { modal.style.display = 'none'; resolve(res); }, 300); };
                document.getElementById('ccOk').onclick = () => close(true);
                document.getElementById('ccCancel').onclick = () => close(false);
            });
        }

        function showPrompt(title, type = "password", okText="Weiter", cancelText="Abbrechen", allowAdminBypass = false) {
            return new Promise(resolve => {
                const modal = document.getElementById('customPrompt');
                const input = document.getElementById('cpInput');
                const okBtn = document.getElementById('cpOk');
                document.getElementById('cpTitle').innerText = title;
                okBtn.innerText = okText;
                document.getElementById('cpCancel').innerText = cancelText;
                input.type = type; input.value = '';
                
                modal.style.display = 'flex';

        // --- Canvas & History Core ---
        const workspace = document.getElementById('workspace');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        let isEraser = false, isRainbow = false, currentColor = '#000000', rainbowHue = 0;
        const baseLineWidth = 15;
        const ongoingPointers = {}; // Pointer Events
        
        let history = []; let historyStep = -1;

        function saveStateToHistory() {
            historyStep++; history.length = historyStep; history.push(canvas.toDataURL());
            if (history.length > 30) { history.shift(); historyStep--; }
            localStorage.setItem('savedArtwork', history[historyStep]);
        }
        function restoreHistoryState() {
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            if(historyStep < 0) return;
            const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0); img.src = history[historyStep];
            localStorage.setItem('savedArtwork', history[historyStep]);
        }

        document.getElementById('undoBtn').onclick = () => { if(historyStep > 0) { historyStep--; restoreHistoryState(); } else if(historyStep===0) { historyStep=-1; restoreHistoryState(); }};
        document.getElementById('redoBtn').onclick = () => { if(historyStep < history.length - 1) { historyStep++; restoreHistoryState(); }};

        function resizeCanvas() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            const dataURL = localStorage.getItem('savedArtwork');
            if (dataURL) { const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0); img.src = dataURL; if(history.length === 0) { history.push(dataURL); historyStep = 0; } } 
            else if(history.length === 0) saveStateToHistory();
        }
        window.addEventListener('resize', resizeCanvas);

        function updateWorkspaceTransform() { workspace.style.transform = `translate(${wsPanX}px, ${wsPanY}px) scale(${wsScale})`; }
        function getCanvasPos(clientX, clientY) { return { x: (clientX - wsPanX) / wsScale, y: (clientY - wsPanY) / wsScale }; }

        function drawLineSegment(x0, y0, x1, y1, pressure, isFist = false) {
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
            
            // Drucksensitivität S-Pen (pressure ist normal zw. 0 und 1)
            let widthMultiplier = pressure > 0 ? Math.max(0.3, pressure * 2.5) : 1;
            
            if (appMode === 'simpel') {
                ctx.lineWidth = isFist ? 80 : baseLineWidth * widthMultiplier;
                ctx.strokeStyle = isFist ? '#ffffff' : '#000000';
            } else {
                ctx.lineWidth = baseLineWidth * widthMultiplier;
                if (isEraser) { ctx.strokeStyle = '#ffffff'; } 
                else if (isRainbow) { rainbowHue = (rainbowHue + 3) % 360; ctx.strokeStyle = `hsl(${rainbowHue}, 100%, 50%)`; } 
                else { ctx.strokeStyle = currentColor; }
            }
            ctx.stroke();
        }

        // --- Moderne PointerEvents (S-Pen, Touch, Maus + Capture) ---
        let fistCount = 0, fistTimer = null, initialPinchDist = null, initialScale = 1;

        function handlePointerDown(e) {
            if (isAppLocked || e.button === 2) return;
            if(e.target.closest('.glass-menu') || e.target.closest('#toolbar') || e.target.closest('.draggable-shape')) return;
            
            // Pointer einfangen -> Malen geht weiter, auch wenn man die Toolbar streift!
            canvas.setPointerCapture(e.pointerId);
            
            const activePointers = Object.keys(ongoingPointers).length + 1;
            
            // Simpel-Modus Faust (3+ Finger)
            if (appMode === 'simpel' && activePointers >= 3) {
                fistCount++; clearTimeout(fistTimer); fistTimer = setTimeout(() => fistCount = 0, 1500);
                if (fistCount >= 3) { ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height); saveStateToHistory(); fistCount = 0; return; }
            }

            // Erweitert Pan/Zoom
            if (appMode === 'erweitert' && activePointers === 2) {
                const keys = Object.keys(ongoingPointers);
                if(keys.length === 1) {
                    const p1 = ongoingPointers[keys[0]];
                    initialPinchDist = Math.hypot(p1.clientX - e.clientX, p1.clientY - e.clientY);
                    initialScale = wsScale;
                }
            }

            const pos = getCanvasPos(e.clientX, e.clientY);
            ongoingPointers[e.pointerId] = { x: pos.x, y: pos.y, clientX: e.clientX, clientY: e.clientY };
            
            // Einen runden Punkt beim bloßen Antippen zeichnen
            const isFist = (appMode === 'simpel' && activePointers >= 3);
            drawLineSegment(pos.x, pos.y, pos.x + 0.1, pos.y + 0.1, e.pressure, isFist);
        }

        function handlePointerMove(e) {
            if (isAppLocked || !ongoingPointers[e.pointerId]) return;
            
            const activePointers = Object.keys(ongoingPointers).length;

            // Pan & Zoom
            if (appMode === 'erweitert' && activePointers === 2 && initialPinchDist) {
                ongoingPointers[e.pointerId].clientX = e.clientX;
                ongoingPointers[e.pointerId].clientY = e.clientY;
                const keys = Object.keys(ongoingPointers);
                if(keys.length === 2) {
                    const p1 = ongoingPointers[keys[0]], p2 = ongoingPointers[keys[1]];
                    const dist = Math.hypot(p1.clientX - p2.clientX, p1.clientY - p2.clientY);
                    const scaleChange = dist / initialPinchDist;
                    wsScale = Math.min(Math.max(0.5, initialScale * scaleChange), 3);
                    const centerX = (p1.clientX + p2.clientX) / 2, centerY = (p1.clientY + p2.clientY) / 2;
                    wsPanX = centerX - (centerX - wsPanX) * (wsScale / initialScale);
                    wsPanY = centerY - (centerY - wsPanY) * (wsScale / initialScale);
                    updateWorkspaceTransform();
                }
                return;
            }

            // Normales Malen
            if (appMode !== 'erweitert' || activePointers === 1 || appMode === 'simpel') {
                const newPos = getCanvasPos(e.clientX, e.clientY);
                const isFist = (appMode === 'simpel' && activePointers >= 3);
                drawLineSegment(ongoingPointers[e.pointerId].x, ongoingPointers[e.pointerId].y, newPos.x, newPos.y, e.pressure, isFist);
                ongoingPointers[e.pointerId].x = newPos.x;
                ongoingPointers[e.pointerId].y = newPos.y;
                ongoingPointers[e.pointerId].clientX = e.clientX;
                ongoingPointers[e.pointerId].clientY = e.clientY;
            }
        }

        function handlePointerUp(e) {
            if(ongoingPointers[e.pointerId]) {
                delete ongoingPointers[e.pointerId];
                canvas.releasePointerCapture(e.pointerId);
                if(Object.keys(ongoingPointers).length < 2) initialPinchDist = null;
                saveStateToHistory();
            }
        }

        canvas.addEventListener('pointerdown', handlePointerDown);
        canvas.addEventListener('pointermove', handlePointerMove);
        canvas.addEventListener('pointerup', handlePointerUp);

        function checkLocks() {
            const offlineDisabled = localStorage.getItem('offlineModeDisabled') === 'true';

            else document.getElementById('offlineOverlay').style.display = 'none';

            const bs = localStorage.getItem('bedtimeStart'), be = localStorage.getItem('bedtimeEnd');
            if (bs && be) {
                const now = new Date(), curr = now.getHours() * 60 + now.getMinutes();
                const s = parseInt(bs.split(':')[0])*60 + parseInt(bs.split(':')[1]), e = parseInt(be.split(':')[0])*60 + parseInt(be.split(':')[1]);
                let isBed = (s < e) ? (curr >= s && curr < e) : (curr >= s || curr < e);
                
                if (isBed && !bedtimeBypassed) { isAppLocked = true; document.getElementById('bedtimeText').innerText = `${bs} - ${be} Uhr`; document.getElementById('bedtimeOverlay').style.display = 'flex'; return; } 
                else if (!isBed) bedtimeBypassed = false;
            }
            document.getElementById('bedtimeOverlay').style.display = 'none';
            if(document.getElementById('lockOverlay').style.display !== 'flex') isAppLocked = false;
        }
        setInterval(checkLocks, 30000); window.addEventListener('online', checkLocks); window.addEventListener('offline', checkLocks);

        document.getElementById('bedtimeBypassBtn').onclick = async () => {
            const input = await showPrompt("Eltern PIN:", "password", "Entsperren");
            if (input === localStorage.getItem('parentPin')) { bedtimeBypassed = true; checkLocks(); } 
            else if(input) await showAlert("Fehler", "Falsche PIN!");
        };

        // --- Gist Fernsteuerung ---
        async function fetchGist() {
            if (!navigator.onLine) return; 
            try {
                const res = await fetch('https://api.github.com/gists/305f300ae73a102e623b3148202af353', { cache: 'no-store', headers: {'Pragma': 'no-cache'} });
                if (!res.ok) return; processGist((await res.json()).files['command.txt'].content);
            } catch (e) { }
        }

        function processGist(text) {
            const lines = text.split(/\r?\n/).map(l => l.trim());
            if (lines[0].startsWith('lock')) {
                if (localStorage.getItem('ignoredLockState') !== text) { isAppLocked = true; document.getElementById('lockReason').innerText = lines[0].split(';')[1] || 'Gesperrt'; document.getElementById('lockOverlay').style.display = 'flex'; }
            } else { document.getElementById('lockOverlay').style.display = 'none'; localStorage.removeItem('ignoredLockState'); checkLocks(); }

            const lastCmd = localStorage.getItem('lastExecutedCmd') || '-';
            if (lines[1] !== '-' && lines[1] !== lastCmd) {
                switch(lines[1].toLowerCase()) {
                    case 'menu': document.getElementById('baseMenu').style.display='flex'; setTimeout(()=>document.getElementById('baseMenu').classList.add('show'),10); break;
                    case 'delete': document.getElementById('trashBtn').click(); break;
                    case 'undo-delete': document.getElementById('undoBtn').click(); break;
                    case 'print': window.print(); break;
                    case 'reload': window.location.reload(); break;
                }
                localStorage.setItem('lastExecutedCmd', lines[1]);
            } else if (lines[1] === '-') localStorage.setItem('lastExecutedCmd', '-');

            if (lines[2] !== localStorage.getItem('savedExtraColors')) {
                localStorage.setItem('savedExtraColors', lines[2]);
                const c = document.getElementById('dynamicColors'); c.innerHTML = '';
                if(lines[2] && lines[2] !== '-') lines[2].split(';').forEach(col => {
                    if(col.startsWith('#')) {
                        const b = document.createElement('div'); b.className = 'btn color-btn dynamic-color'; b.style.backgroundColor = col; b.setAttribute('data-color', col); c.appendChild(b);
                        b.onclick = () => { updateActiveButton(b); isRainbow=false; currentColor=col; document.getElementById('modeBtn').style.backgroundColor='#4CAF50'; document.getElementById('penIcon').style.display='block'; document.getElementById('eraserIcon').style.display='none'; isEraser=false; };
                    }
                });
            }
            localStorage.setItem('lastGistContent', text);
        }
        setInterval(fetchGist, 15000); if (localStorage.getItem('lastGistContent')) processGist(localStorage.getItem('lastGistContent')); fetchGist();

        // Init
        resizeCanvas(); checkLocks();
        if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
    </script>
</body>
</html>
