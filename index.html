<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#f0f0f0">
    <link rel="manifest" href="manifest.json">
    <title>Mal-App</title>
    <style>
        /* Grundlegendes Layout & Fullscreen Setup */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #ffffff;
            font-family: sans-serif;
            touch-action: none;
        }

        /* Startbildschirm (Splash Screen) */
        #splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            color: #ff4081;
            transition: opacity 0.5s ease;
        }

        /* Sperrbildschirm (Lock Screen) */
        #lockOverlay {
            display: none; /* Standardmäßig versteckt */
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0,0,0,0.9);
            z-index: 9000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            font-size: 40px;
            font-weight: bold;
            text-align: center;
            padding: 20px;
        }

        /* Werkzeugleiste - Komplett durchscrollbar */
        #toolbar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background-color: #f0f0f0;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 10;
            overflow-x: auto;
            padding: 0 10px;
            scrollbar-width: none; /* Firefox Scrollbar verstecken */
        }
        #toolbar::-webkit-scrollbar {
            display: none; /* Chrome/Safari Scrollbar verstecken */
        }

        /* Standard Buttons */
        .btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            margin-right: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s, border-color 0.2s;
        }

        .btn:active {
            transform: scale(0.9);
        }

        .active-btn {
            transform: scale(1.15);
            border-color: #333333;
        }

        /* Regenbogen Animation */
        @keyframes rainbowSpin {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        .rainbow-btn {
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3, #ff0000);
            background-size: 200% 100%;
            animation: rainbowSpin 2s linear infinite;
        }

        /* Werkzeuge */
        #modeBtn { background-color: #4CAF50; }
        #trashBtn { background-color: #555555; }

        /* Zeichenfläche */
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Verstecktes Elternmenü */
        #parentMenu {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0,0,0,0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .menu-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 90%;
        }

        .menu-box h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .menu-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background-color: #2196F3;
            color: white;
            font-weight: bold;
        }

        .menu-btn.close {
            background-color: #f44336;
        }

        svg {
            width: 30px;
            height: 30px;
            stroke: white;
        }
    </style>
</head>
<body>

    <!-- Startbildschirm -->
    <div id="splash">Marco liebt dich</div>

    <!-- Sperrbildschirm -->
    <div id="lockOverlay">
        <div id="lockReason">Gesperrt</div>
    </div>

    <!-- Scrollbare Werkzeugleiste -->
    <div id="toolbar">
        <div class="btn color-btn active-btn" style="background-color: #000000;" data-color="#000000"></div>
        <div class="btn color-btn rainbow-btn" data-color="rainbow"></div>
        <div class="btn color-btn" style="background-color: #FFC0CB;" data-color="#FFC0CB"></div>
        <div class="btn color-btn" style="background-color: #FF69B4;" data-color="#FF69B4"></div>
        <div class="btn color-btn" style="background-color: #FF00FF;" data-color="#FF00FF"></div>
        <div class="btn color-btn" style="background-color: #00E5FF;" data-color="#00E5FF"></div>
        <div class="btn color-btn" style="background-color: #8D6E63;" data-color="#8D6E63"></div>
        <div class="btn color-btn" style="background-color: #FF9800;" data-color="#FF9800"></div>
        <div class="btn color-btn" style="background-color: #FFEB3B;" data-color="#FFEB3B"></div>
        <div class="btn color-btn" style="background-color: #F44336;" data-color="#F44336"></div>
        <div class="btn color-btn" style="background-color: #4CAF50;" data-color="#4CAF50"></div>
        <div class="btn color-btn" style="background-color: #2196F3;" data-color="#2196F3"></div>
        
        <!-- Hier werden Gist-Farben eingefügt -->
        <div id="dynamicColors" style="display:flex;"></div>

        <!-- Trennlinie zu den Werkzeugen -->
        <div style="width: 2px; height: 40px; background: #ccc; margin: 0 10px; flex-shrink: 0;"></div>

        <div class="btn" id="modeBtn">
            <svg id="penIcon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
                <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
                <path d="M2 2l7.586 7.586"></path>
                <circle cx="11" cy="11" r="2"></circle>
            </svg>
            <svg id="eraserIcon" style="display: none;" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 20H7L3 16C2.5 15.5 2.5 14.5 3 14L13 4C13.5 3.5 14.5 3.5 15 4L20 9C20.5 9.5 20.5 10.5 20 11L11 20H20V20Z"></path>
            </svg>
        </div>
        <div class="btn" id="trashBtn" style="margin-right: 20px;">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"></path>
            </svg>
        </div>
    </div>

    <!-- Zeichenfläche -->
    <canvas id="canvas"></canvas>

    <!-- Eltern-Menü -->
    <div id="parentMenu">
        <div class="menu-box">
            <h2>Eltern-Optionen</h2>
            <button class="menu-btn" id="undoTrashBtn">Löschen rückgängig machen</button>
            <button class="menu-btn" id="clearDataBtn">Speicher leeren</button>
            <button class="menu-btn" id="printBtn">Kunstwerk drucken</button>
            <button class="menu-btn close" id="closeMenuBtn">Menü schließen</button>
        </div>
    </div>

    <script>
        // --- 1. Startbildschirm & Geräteerkennung ---
        window.addEventListener('load', () => {
            const splash = document.getElementById('splash');
            const isMobile = window.innerWidth <= 768 || /Android|webOS|iPhone|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            
            if (isMobile) {
                splash.style.display = 'none'; // Auf Handys direkt verstecken
            } else {
                setTimeout(() => {
                    splash.style.opacity = '0';
                    setTimeout(() => { splash.style.display = 'none'; }, 500);
                }, 1000);
            }
        });

        // --- 2. Canvas Setup ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        let isEraser = false;
        let isRainbow = false;
        let currentColor = '#000000';
        let rainbowHue = 0;
        const lineWidth = 15;
        let isLocked = false;
        
        // Multi-Touch Tracking für flüssiges Zeichnen und "Hand abmalen"
        const ongoingTouches = {};
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            loadArtwork();
        }
        window.addEventListener('resize', resizeCanvas);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // --- 3. Gist-Fernsteuerung & Offline-Speicher ---
        const gistUrl = 'https://gist.githubusercontent.com/Kleinlauch/305f300ae73a102e623b3148202af353/raw/command.txt';
        
        async function fetchGist() {
            if (!navigator.onLine) return; // Ohne Internet nichts tun
            
            try {
                // Wir zwingen den Browser, Cache zu ignorieren
                const response = await fetch(gistUrl + '?cb=' + new Date().getTime(), { cache: 'no-store' });
                if (!response.ok) return;
                const text = await response.text();
                processGist(text);
            } catch (e) {
                console.log("Fehler beim Abrufen:", e);
            }
        }

        function processGist(text) {
            // Extrem robustes Trennen von Zeilen (egal ob Windows oder Linux Umbrüche)
            const lines = text.split(/\r?\n/).map(l => l.trim());
            const lockLine = lines[0] || 'unlock';
            const cmdLine = lines[1] || '-';
            const colorsLine = lines[2] || '';

            // --- Zeile 1: Lock / Unlock ---
            const ignoredLock = localStorage.getItem('ignoredLockState');
            if (lockLine.startsWith('lock')) {
                if (ignoredLock !== text) {
                    const reason = lockLine.split(';')[1] || 'Gesperrt';
                    showLock(reason);
                }
            } else {
                hideLock();
                localStorage.removeItem('ignoredLockState');
            }

            // --- Zeile 2: Befehle ausführen ---
            const lastExecutedCmd = localStorage.getItem('lastExecutedCmd') || '-';
            
            if (cmdLine !== '-' && cmdLine !== lastExecutedCmd) {
                executeCommand(cmdLine);
                localStorage.setItem('lastExecutedCmd', cmdLine);
            } else if (cmdLine === '-') {
                // Reset, wartet auf neuen Befehl
                localStorage.setItem('lastExecutedCmd', '-');
            }

            // --- Zeile 3: Zusätzliche Farben ---
            const savedExtraColors = localStorage.getItem('savedExtraColors');
            if (colorsLine !== savedExtraColors) {
                localStorage.setItem('savedExtraColors', colorsLine);
                renderExtraColors(colorsLine);
            }

            localStorage.setItem('lastGistContent', text);
        }

        function executeCommand(cmd) {
            switch(cmd.toLowerCase()) {
                case 'menu': 
                    document.getElementById('parentMenu').style.display = 'flex'; 
                    break;
                case 'delete': 
                    clearCanvas(); 
                    break;
                case 'undo-delete': 
                    undoCanvas(); 
                    break;
                case 'print': 
                    window.print(); 
                    break;
                case 'reload':
                    window.location.reload();
                    break;
            }
        }

        setInterval(fetchGist, 10000); // Alle 10 Sekunden abrufen
        
        // Beim Start Offline-Daten laden und dann Gist holen
        const offlineGistContent = localStorage.getItem('lastGistContent');
        if (offlineGistContent) processGist(offlineGistContent);
        fetchGist();

        // --- 4. Sperrbildschirm Funktionen ---
        function showLock(reason) {
            isLocked = true;
            document.getElementById('lockReason').innerText = reason;
            document.getElementById('lockOverlay').style.display = 'flex';
        }

        function hideLock() {
            isLocked = false;
            document.getElementById('lockOverlay').style.display = 'none';
        }

        // --- 5. Dynamische Farben rendern ---
        function renderExtraColors(hexString) {
            const container = document.getElementById('dynamicColors');
            container.innerHTML = ''; 

            if (!hexString || hexString === '-') return;

            const colors = hexString.split(';');
            colors.forEach(color => {
                if (color.startsWith('#')) {
                    const btn = document.createElement('div');
                    btn.className = 'btn color-btn dynamic-color';
                    btn.style.backgroundColor = color;
                    btn.setAttribute('data-color', color);
                    container.appendChild(btn);

                    const selectColor = () => {
                        updateActiveButton(btn);
                        isRainbow = false;
                        currentColor = color;
                        setDrawMode();
                    };
                    btn.addEventListener('click', selectColor);
                    btn.addEventListener('touchstart', (e) => { e.preventDefault(); selectColor(); });
                }
            });
        }

        // --- 6. Speicher-Funktionen ---
        function saveArtwork() {
            localStorage.setItem('savedArtwork', canvas.toDataURL());
        }

        function loadArtwork() {
            const dataURL = localStorage.getItem('savedArtwork');
            if (dataURL) {
                const img = new Image();
                img.onload = () => { ctx.drawImage(img, 0, 0); };
                img.src = dataURL;
            }
        }

        function clearCanvas() {
            localStorage.setItem('undoArtwork', canvas.toDataURL());
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            saveArtwork();
        }

        function undoCanvas() {
            const undoData = localStorage.getItem('undoArtwork');
            if (undoData) {
                const img = new Image();
                img.onload = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                    saveArtwork();
                };
                img.src = undoData;
            }
        }

        // --- 7. Zeichen-Logik (Multi-Touch + Versatz behoben) ---
        // Die Zeichenfunktion für einzelne Linienstücke
        function drawLineSegment(x0, y0, x1, y1) {
            ctx.beginPath();
            ctx.moveTo(x0, y0);
            ctx.lineTo(x1, y1);
            ctx.lineWidth = lineWidth;
            
            if (isEraser) {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.strokeStyle = 'rgba(0,0,0,1)';
            } else if (isRainbow) {
                ctx.globalCompositeOperation = 'source-over';
                rainbowHue = (rainbowHue + 3) % 360; 
                ctx.strokeStyle = `hsl(${rainbowHue}, 100%, 50%)`;
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = currentColor;
            }
            ctx.stroke();
        }

        function handleStart(e) {
            if (isLocked) return;
            e.preventDefault(); 
            const rect = canvas.getBoundingClientRect(); // Verhindert versetzte Linien

            if (e.type === 'touchstart') {
                const touches = e.changedTouches;
                for (let i = 0; i < touches.length; i++) {
                    const id = touches[i].identifier;
                    const x = touches[i].clientX - rect.left;
                    const y = touches[i].clientY - rect.top;
                    ongoingTouches[id] = { x: x, y: y };
                    // Zeichne den ersten Punkt
                    drawLineSegment(x, y, x + 0.1, y);
                }
            } else {
                // Maus
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                ongoingTouches['mouse'] = { x: x, y: y };
                drawLineSegment(x, y, x + 0.1, y);
            }
        }

        function handleMove(e) {
            if (isLocked) return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();

            if (e.type === 'touchmove') {
                const touches = e.changedTouches;
                for (let i = 0; i < touches.length; i++) {
                    const id = touches[i].identifier;
                    if (ongoingTouches[id]) {
                        const newX = touches[i].clientX - rect.left;
                        const newY = touches[i].clientY - rect.top;
                        
                        drawLineSegment(ongoingTouches[id].x, ongoingTouches[id].y, newX, newY);
                        
                        // Letzte Position aktualisieren
                        ongoingTouches[id].x = newX;
                        ongoingTouches[id].y = newY;
                    }
                }
            } else {
                // Maus
                if (ongoingTouches['mouse']) {
                    const newX = e.clientX - rect.left;
                    const newY = e.clientY - rect.top;
                    drawLineSegment(ongoingTouches['mouse'].x, ongoingTouches['mouse'].y, newX, newY);
                    ongoingTouches['mouse'].x = newX;
                    ongoingTouches['mouse'].y = newY;
                }
            }
        }

        function handleEnd(e) {
            if (isLocked) return;
            e.preventDefault();
            if (e.type === 'touchend' || e.type === 'touchcancel') {
                const touches = e.changedTouches;
                for (let i = 0; i < touches.length; i++) {
                    delete ongoingTouches[touches[i].identifier];
                }
            } else {
                delete ongoingTouches['mouse'];
            }
            saveArtwork();
        }

        // Event Listeners für das Canvas binden
        canvas.addEventListener('touchstart', handleStart, { passive: false });
        canvas.addEventListener('touchmove', handleMove, { passive: false });
        canvas.addEventListener('touchend', handleEnd);
        canvas.addEventListener('touchcancel', handleEnd);

        canvas.addEventListener('mousedown', handleStart);
        canvas.addEventListener('mousemove', handleMove);
        canvas.addEventListener('mouseup', handleEnd);
        canvas.addEventListener('mouseleave', handleEnd);

        
        // --- 8. UI Interaktionen (Werkzeuge) ---
        function updateActiveButton(clickedBtn) {
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active-btn'));
            clickedBtn.classList.add('active-btn');
        }

        document.querySelectorAll('.color-btn:not(.dynamic-color)').forEach(btn => {
            const selectColor = () => {
                updateActiveButton(btn);
                const colorVal = btn.getAttribute('data-color');
                if (colorVal === 'rainbow') {
                    isRainbow = true;
                } else {
                    isRainbow = false;
                    currentColor = colorVal;
                }
                setDrawMode();
            };
            btn.addEventListener('click', selectColor);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); selectColor(); });
        });

        const modeBtn = document.getElementById('modeBtn');
        const penIcon = document.getElementById('penIcon');
        const eraserIcon = document.getElementById('eraserIcon');

        function setDrawMode() {
            isEraser = false;
            modeBtn.style.backgroundColor = '#4CAF50';
            penIcon.style.display = 'block';
            eraserIcon.style.display = 'none';
        }

        modeBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isEraser = !isEraser;
            if (isEraser) {
                modeBtn.style.backgroundColor = '#f44336';
                penIcon.style.display = 'none';
                eraserIcon.style.display = 'block';
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active-btn'));
            } else {
                setDrawMode();
                const activeBtn = Array.from(document.querySelectorAll('.color-btn')).find(b => 
                    (isRainbow && b.getAttribute('data-color') === 'rainbow') || 
                    (!isRainbow && b.getAttribute('data-color') === currentColor)
                );
                if(activeBtn) activeBtn.classList.add('active-btn');
            }
        });

        document.getElementById('trashBtn').addEventListener('touchstart', (e) => { e.preventDefault(); clearCanvas(); });
        document.getElementById('trashBtn').addEventListener('click', clearCanvas);


        // --- 9. Fünf-Finger Timer für Menü & Notfall-PIN ---
        const parentMenu = document.getElementById('parentMenu');
        let parentMenuTimer = null;
        let fiveFingersDown = false;

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length >= 5) {
                fiveFingersDown = true;
                clearTimeout(parentMenuTimer); 
                
                if (isLocked) {
                    parentMenuTimer = setTimeout(() => {
                        if (fiveFingersDown) {
                            const pin = prompt('Notfall-Entsperrung (PIN eingeben):');
                            if (pin === '1104') {
                                localStorage.setItem('ignoredLockState', localStorage.getItem('lastGistContent'));
                                hideLock();
                            }
                        }
                    }, 3000);
                } else {
                    parentMenuTimer = setTimeout(() => {
                        if (fiveFingersDown) parentMenu.style.display = 'flex';
                    }, 2000); 
                }
            }
        });

        window.addEventListener('touchend', (e) => {
            if (e.touches.length < 5) {
                fiveFingersDown = false;
                clearTimeout(parentMenuTimer);
            }
        });

        // --- 10. Eltern-Menü Buttons ---
        document.getElementById('closeMenuBtn').addEventListener('click', () => { parentMenu.style.display = 'none'; });
        document.getElementById('undoTrashBtn').addEventListener('click', () => { undoCanvas(); parentMenu.style.display = 'none'; });
        document.getElementById('printBtn').addEventListener('click', () => { parentMenu.style.display = 'none'; setTimeout(() => { window.print(); }, 500); });
        
        document.getElementById('clearDataBtn').addEventListener('click', () => {
            if(confirm('Wirklich alles endgültig löschen?')) {
                localStorage.removeItem('savedArtwork');
                localStorage.removeItem('undoArtwork');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                parentMenu.style.display = 'none';
            }
        });

        resizeCanvas();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Error:', err));
            });
        }
    </script>
</body>
</html>
