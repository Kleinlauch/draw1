<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <title>Mal-App</title>
    <style>
        :root {
            --theme-color: #2196F3;
            --theme-bg: rgba(33, 150, 243, 0.2);
            --theme-glass: rgba(240, 240, 240, 0.95);
        }

        /* Reset & Layout */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { width: 100vw; height: 100vh; overflow: hidden; background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; touch-action: none; }
        img, canvas { -webkit-touch-callout: none; }

        /* Splash Screen */
        #splash { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #ffffff; z-index: 9999; display: flex; justify-content: center; align-items: center; font-size: 32px; font-weight: bold; color: var(--theme-color); transition: opacity 0.5s ease; }

        /* Fullscreen Overlays (Lock, Bedtime, Offline) */
        .fullscreen-lock { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(10,10,10,0.95); z-index: 9000; justify-content: center; align-items: center; flex-direction: column; color: white; text-align: center; padding: 20px; backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); }
        .lock-icon { font-size: 80px; margin-bottom: 20px; }
        .lock-text { font-size: 32px; font-weight: bold; }
        .lock-subtext { font-size: 20px; color: #aaa; margin-top: 10px; }
        #bedtimeBypassBtn { position: absolute; top: 20px; right: 20px; padding: 10px 20px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; color: white; font-weight: bold; z-index: 9001; cursor: pointer; }

        /* Toolbar */
        #toolbar { position: absolute; top: 0; left: 0; width: 100%; height: 80px; background-color: var(--theme-glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: flex; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); z-index: 10; border-bottom: 2px solid var(--theme-color); transition: transform 0.3s; }
        .toolbar-hidden { transform: translateY(-100%); }

        #colorScrollArea { display: flex; align-items: center; height: 100%; flex-grow: 1; overflow-x: auto; overflow-y: hidden; padding: 0 10px; scrollbar-width: none; touch-action: pan-x; }
        #colorScrollArea::-webkit-scrollbar { display: none; }
        #toolsArea { display: flex; align-items: center; height: 100%; flex-shrink: 0; padding: 0 10px; border-left: 2px solid #ccc; background-color: transparent; }

        .btn { width: 50px; height: 50px; border-radius: 50%; border: 4px solid #ffffff; margin-right: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); flex-shrink: 0; display: flex; justify-content: center; align-items: center; transition: transform 0.2s, border-color 0.2s; cursor: pointer; background-color: #eee; }
        .btn:active { transform: scale(0.9); }
        .active-btn { transform: scale(1.15); border-color: #333333; }

        @keyframes rainbowSpin { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
        .rainbow-btn { background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3, #ff0000); background-size: 200% 100%; animation: rainbowSpin 2s linear infinite; }

        #modeBtn { background-color: #4CAF50; }
        #trashBtn { background-color: #555555; }
        .undo-redo-btn { background-color: var(--theme-color); }
        #addShapeBtn { background-color: #9C27B0; display: none; }

        /* Workspace (Canvas + Shapes) */
        #workspace { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; transform-origin: 0 0; z-index: 1; }
        #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: white; }
        .draggable-shape { position: absolute; width: 100px; height: 100px; transform: translate(-50%, -50%); z-index: 5; pointer-events: auto; touch-action: none; display: flex; justify-content: center; align-items: center; filter: drop-shadow(0px 4px 5px rgba(0,0,0,0.3)); }
        
        /* Apple Like Liquid Glass Menus */
        .glass-menu { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(0,0,0,0.5); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 9500; justify-content: center; align-items: center; flex-direction: column; opacity: 0; transition: opacity 0.3s; }
        .glass-menu.show { opacity: 1; }
        .menu-box { background: rgba(30, 30, 30, 0.85); border: 1px solid var(--theme-color); border-radius: 24px; padding: 30px; text-align: center; width: 90%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); color: white; display: flex; flex-direction: column; gap: 10px; max-height: 90vh; overflow-y: auto; }
        .menu-box h2 { margin-bottom: 10px; font-weight: 600; color: var(--theme-color); }
        .menu-box p { margin-bottom: 15px; font-size: 14px; color: #ccc; }
        
        .menu-btn { width: 100%; padding: 14px; font-size: 16px; border: none; border-radius: 12px; background-color: rgba(255,255,255,0.1); color: white; font-weight: 500; transition: background 0.2s, border-color 0.2s; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); }
        .menu-btn:active { background-color: rgba(255,255,255,0.2); }
        .menu-btn.red { background-color: rgba(244, 67, 54, 0.4); border-color: rgba(244, 67, 54, 0.6); }
        .menu-btn.blue { background-color: var(--theme-bg); border-color: var(--theme-color); }
        .menu-btn:disabled { opacity: 0.5; pointer-events: none; }

        .glass-input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.4); color: white; font-size: 18px; text-align: center; margin-bottom: 15px; outline: none; user-select: auto; -webkit-user-select: auto; }
        .glass-input:focus { border-color: var(--theme-color); }
        .row { display: flex; gap: 10px; }
        .row > * { flex: 1; }

        #logArea { background: rgba(0,0,0,0.5); padding: 10px; border-radius: 12px; font-family: monospace; font-size: 11px; text-align: left; height: 150px; overflow-y: auto; color: #00ff00; margin-bottom: 10px; }
        #logArea div { margin-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 2px;}

        /* Select & Color Input Styling */
        select.glass-input { appearance: none; }
        input[type="color"].glass-input { padding: 0; height: 50px; cursor: pointer; }
        
        .save-item { padding: 10px; background: rgba(255,255,255,0.1); border-radius: 8px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center;}
        .save-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        svg { width: 26px; height: 26px; stroke: white; }

        /* NUR DAS BILD DRUCKEN */
        @media print {
            body * { visibility: hidden !important; }
            #workspace, #workspace * { visibility: visible !important; }
            #workspace { position: absolute !important; left: 0 !important; top: 0 !important; transform: none !important; width: 100% !important; height: 100% !important; }
            @page { margin: 0; size: auto; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="splash">Marco liebt dich</div>

    <!-- Locks -->

    <!-- Toolbar -->
    <div id="toolbar">
        <div id="colorScrollArea">
            <div class="btn color-btn active-btn" style="background-color: #000000;" data-color="#000000"></div>
            <div class="btn color-btn rainbow-btn" data-color="rainbow"></div>
            <div class="btn color-btn" style="background-color: #FFC0CB;" data-color="#FFC0CB"></div>
            <div class="btn color-btn" style="background-color: #FF69B4;" data-color="#FF69B4"></div>
            <div class="btn color-btn" style="background-color: #FF00FF;" data-color="#FF00FF"></div>
            <div class="btn color-btn" style="background-color: #00E5FF;" data-color="#00E5FF"></div>
            <div class="btn color-btn" style="background-color: #8D6E63;" data-color="#8D6E63"></div>
            <div class="btn color-btn" style="background-color: #FF9800;" data-color="#FF9800"></div>
            <div class="btn color-btn" style="background-color: #FFEB3B;" data-color="#FFEB3B"></div>
            <div class="btn color-btn" style="background-color: #F44336;" data-color="#F44336"></div>
            <div class="btn color-btn" style="background-color: #4CAF50;" data-color="#4CAF50"></div>

        <div id="toolsArea">
            <div class="btn" id="addShapeBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            </div>
            <div class="btn undo-redo-btn" id="undoBtn"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h10a5 5 0 0 1 5 5v0a5 5 0 0 1-5 5H9"/><polyline points="3 10 7 14 7 6"/></svg></div>
            <div class="btn undo-redo-btn" id="redoBtn"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10H11a5 5 0 0 0-5 5v0a5 5 0 0 0 5 5h4"/><polyline points="21 10 17 14 17 6"/></svg></div>

                <svg id="eraserIcon" style="display: none;" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H7L3 16C2.5 15.5 2.5 14.5 3 14L13 4C13.5 3.5 14.5 3.5 15 4L20 9C20.5 9.5 20.5 10.5 20 11L11 20H20V20Z"></path></svg>
            </div>
            <div class="btn" id="trashBtn"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"></path></svg></div>
        </div>

    <!-- Workspace -->
    <div id="workspace">
        <canvas id="canvas"></canvas>
    </div>

    <!-- Menüs -->
    <div id="baseMenu" class="glass-menu">
        <div class="menu-box">
            <h2>Optionen</h2>
            <button class="menu-btn blue" id="bmBtnSaveLoad">Speichern & Laden</button>
            <button class="menu-btn" id="bmBtnPrint">Bild Drucken</button>
            <button class="menu-btn red" id="bmBtnParent">Eltern Menü</button>
            <button class="menu-btn" id="bmBtnClose">Schließen</button>
        </div>
    </div>

    <div id="parentMenu" class="glass-menu">
        <div class="menu-box">
            <h2>Eltern Menü</h2>
            <div class="row">
                <select id="appModeSelect" class="glass-input">
                    <option value="simpel">Simpel</option>
                    <option value="einfach">Einfach</option>
                    <option value="erweitert">Erweitert</option>
                </select>
                <input type="color" id="themeColorInput" class="glass-input" value="#2196F3">
            </div>

        <div class="menu-box">
            <h2 style="color: #F44336;">ADMIN</h2>

    <div id="saveLoadMenu" class="glass-menu">
        <div class="menu-box">
            <h2>Galerie</h2>
            <div id="saveList" style="text-align: left; max-height: 150px; overflow-y: auto; margin-bottom: 10px;"></div>
            <button class="menu-btn blue" id="slBtnSave">Aktuelles Bild Speichern</button>
            <div class="row">
                <button class="menu-btn" id="slBtnExport">Export (.json)</button>
                <button class="menu-btn" id="slBtnImport">Import</button>

    <!-- Custom Dialogs -->
    <div id="customPrompt" class="glass-menu">
        <div class="menu-box">
            <h2 id="cpTitle">Eingabe</h2>
            <input type="password" id="cpInput" class="glass-input" autocomplete="off">
            <div class="row">
                <button class="menu-btn red" id="cpCancel">Abbrechen</button>
                <button class="menu-btn blue" id="cpOk">OK</button>
            </div>
        </div>
    </div>

    <div id="customConfirm" class="glass-menu">
        <div class="menu-box">
            <h2 id="ccTitle">Bestätigen</h2>
            <p id="ccMessage"></p>
            <div class="row">
                <button class="menu-btn red" id="ccCancel">Abbrechen</button>
                <button class="menu-btn blue" id="ccOk">OK</button>
            </div>
        </div>
    </div>

    <div id="customAlert" class="glass-menu">
        <div class="menu-box">
            <h2 id="caTitle">Hinweis</h2>
            <p id="caMessage"></p>
            <button class="menu-btn blue" id="caOk">Verstanden</button>
        </div>
    </div>
    
    <div id="customTimePrompt" class="glass-menu">
        <div class="menu-box">
            <h2>Schlafenszeit</h2>
            <div class="row">
                <input type="time" id="ctStart" class="glass-input">
                <input type="time" id="ctEnd" class="glass-input">
            </div>
            <div class="row">
                <button class="menu-btn red" id="ctCancel">Abbrechen</button>
                <button class="menu-btn blue" id="ctOk">Speichern</button>
            </div>
        </div>
    </div>

    <script>
        // --- Globale Variablen ---
        let appMode = localStorage.getItem('appMode') || 'einfach';
        let themeColor = localStorage.getItem('themeColor') || '#2196F3';
        
        let wsScale = 1, wsPanX = 0, wsPanY = 0;
        let isAppLocked = false, bedtimeBypassed = false;
        
        // --- Theme Anwenden ---
        function applyTheme() {
            document.documentElement.style.setProperty('--theme-color', themeColor);
            document.documentElement.style.setProperty('--theme-bg', themeColor + '33'); // mit transparenz
            document.getElementById('themeColorInput').value = themeColor;
        }
        applyTheme();

        // --- Logger ---
        function appLog(msg) {
            let logs = JSON.parse(localStorage.getItem('appLogs') || '[]');
            logs.unshift(`[${new Date().toLocaleTimeString('de-DE')}] ${msg}`);
            if (logs.length > 50) logs.pop();
            localStorage.setItem('appLogs', JSON.stringify(logs));
            const logArea = document.getElementById('logArea');
            if(logArea) logArea.innerHTML = logs.map(l => `<div>${l}</div>`).join('');
        }

        // --- Liquid Glass Dialogs & Keyboard Support ---
        function bindKeys(okBtnId, cancelBtnId) {
            const handler = (e) => {
                if(e.key === 'Enter') { e.preventDefault(); document.getElementById(okBtnId).click(); }
                if(e.key === 'Escape' && cancelBtnId) { e.preventDefault(); document.getElementById(cancelBtnId).click(); }
            };
            window.addEventListener('keydown', handler);
            return () => window.removeEventListener('keydown', handler);
        }

        function showAlert(title, message, btnText = "OK") {
            return new Promise(resolve => {
                const modal = document.getElementById('customAlert');
                document.getElementById('caTitle').innerText = title;
                document.getElementById('caMessage').innerText = message;
                const okBtn = document.getElementById('caOk');
                okBtn.innerText = btnText;
                
                modal.style.display = 'flex';
                setTimeout(() => modal.classList.add('show'), 10);
                const unbind = bindKeys('caOk', null);
                
                okBtn.onclick = () => {
                    unbind();
                    modal.classList.remove('show');
                    setTimeout(() => { modal.style.display = 'none'; resolve(); }, 300);
                };
            });
        }

        function showConfirm(title, message, okText="Ja", cancelText="Nein") {
            return new Promise(resolve => {
                const modal = document.getElementById('customConfirm');
                document.getElementById('ccTitle').innerText = title;
                document.getElementById('ccMessage').innerText = message;
                document.getElementById('ccOk').innerText = okText;
                document.getElementById('ccCancel').innerText = cancelText;
                
                modal.style.display = 'flex';
                setTimeout(() => modal.classList.add('show'), 10);
                const unbind = bindKeys('ccOk', 'ccCancel');
                
                const close = (res) => {
                    unbind();
                    modal.classList.remove('show');
                    setTimeout(() => { modal.style.display = 'none'; resolve(res); }, 300);
                };
                document.getElementById('ccOk').onclick = () => close(true);
                document.getElementById('ccCancel').onclick = () => close(false);
            });
        }

        function showPrompt(title, type = "password", okText="Weiter", cancelText="Abbrechen", allowAdminBypass = false) {
            return new Promise(resolve => {
                const modal = document.getElementById('customPrompt');
                const input = document.getElementById('cpInput');
                const okBtn = document.getElementById('cpOk');
                document.getElementById('cpTitle').innerText = title;
                okBtn.innerText = okText;
                document.getElementById('cpCancel').innerText = cancelText;
                input.type = type; input.value = '';
                
                modal.style.display = 'flex';
                setTimeout(() => { modal.classList.add('show'); input.focus(); }, 10);
                const unbind = bindKeys('cpOk', 'cpCancel');
                
                const close = (res) => {
                    unbind();
                    modal.classList.remove('show');
                    setTimeout(() => { modal.style.display = 'none'; resolve(res); }, 300);
                };

                let holdTimer;
                const downEvent = (e) => {
                    if(allowAdminBypass && input.value === '') {
                        holdTimer = setTimeout(async () => {
                            clearTimeout(holdTimer);
                            unbind();
                            modal.classList.remove('show');
                            modal.style.display = 'none';
                            const ap = prompt("ADMIN PIN:"); // Nativer Fallback für geheimen Bypass
                            if(ap === '1104') resolve('ADMIN_BYPASS');
                            else resolve(null);
                        }, 2000);
                    }
                };
                const upEvent = () => clearTimeout(holdTimer);
                
                okBtn.addEventListener('mousedown', downEvent);
                okBtn.addEventListener('touchstart', downEvent);
                okBtn.addEventListener('mouseup', upEvent);
                okBtn.addEventListener('touchend', upEvent);

                okBtn.onclick = () => close(input.value);
                document.getElementById('cpCancel').onclick = () => close(null);
            });
        }

        // --- Modus System ---
        function applyMode() {
            document.getElementById('appModeSelect').value = appMode;
            const tb = document.getElementById('toolbar');
            const shapeBtn = document.getElementById('addShapeBtn');
            
            if(appMode === 'simpel') {
                tb.classList.add('toolbar-hidden');
            } else {
                tb.classList.remove('toolbar-hidden');
            }
            
            if(appMode === 'erweitert') {
                shapeBtn.style.display = 'flex';
            } else {
                shapeBtn.style.display = 'none';
                wsScale = 1; wsPanX = 0; wsPanY = 0;
                updateWorkspaceTransform();
                document.querySelectorAll('.draggable-shape').forEach(el => el.remove());
            }
        }

        // --- Startbildschirm ---
        window.addEventListener('load', () => {
            const isMobile = window.innerWidth <= 768 || /Android|iPhone|iPad/i.test(navigator.userAgent);
            const splash = document.getElementById('splash');
            if(isMobile) splash.style.display = 'none';
            else setTimeout(() => { splash.style.opacity = '0'; setTimeout(() => splash.style.display='none', 500); }, 1000);
            
            applyMode();
            appLog("App gestartet");
            renderLogs();
        });

        // --- Workspace & Canvas Core ---
        const workspace = document.getElementById('workspace');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        let isEraser = false, isRainbow = false, currentColor = '#000000', rainbowHue = 0;
        const lineWidth = 15;
        const ongoingTouches = {};
        
        // History
        let history = []; let historyStep = -1;

        function saveStateToHistory() {
            historyStep++;
            history.length = historyStep; 
            history.push(canvas.toDataURL());
            if (history.length > 30) { history.shift(); historyStep--; }
            localStorage.setItem('savedArtwork', history[historyStep]);
        }

        function restoreHistoryState() {
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            if(historyStep < 0) return;
            const img = new Image();
            img.onload = () => ctx.drawImage(img, 0, 0);
            img.src = history[historyStep];
            localStorage.setItem('savedArtwork', history[historyStep]);
        }

        document.getElementById('undoBtn').onclick = () => { if(historyStep > 0) { historyStep--; restoreHistoryState(); } else if(historyStep===0) { historyStep=-1; restoreHistoryState(); }};
        document.getElementById('redoBtn').onclick = () => { if(historyStep < history.length - 1) { historyStep++; restoreHistoryState(); }};

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const dataURL = localStorage.getItem('savedArtwork');
            if (dataURL) {
                const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0); img.src = dataURL;
                if(history.length === 0) { history.push(dataURL); historyStep = 0; }
            } else if(history.length === 0) saveStateToHistory();
        }
        window.addEventListener('resize', resizeCanvas);

        function updateWorkspaceTransform() {
            workspace.style.transform = `translate(${wsPanX}px, ${wsPanY}px) scale(${wsScale})`;
        }

        // Koordinaten Mapping! (WICHTIG für Offset Bug & Erweitert Modus)
        function getCanvasPos(clientX, clientY) {
            return {
                x: (clientX - wsPanX) / wsScale,
                y: (clientY - wsPanY) / wsScale
            };
        }

        function drawLineSegment(x0, y0, x1, y1, isFist = false) {
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
            
            if (appMode === 'simpel') {
                ctx.lineWidth = isFist ? 60 : lineWidth;
                ctx.strokeStyle = isFist ? '#ffffff' : '#000000';
            } else {
                ctx.lineWidth = lineWidth;
                if (isEraser) {
                    ctx.strokeStyle = '#ffffff';
                } else if (isRainbow) {
                    rainbowHue = (rainbowHue + 3) % 360; 
                    ctx.strokeStyle = `hsl(${rainbowHue}, 100%, 50%)`;
                } else {
                    ctx.strokeStyle = currentColor;
                }
            }
            ctx.stroke();
        }

        // --- Erweiterte Touch Logik (Simpel Fist & Erweitert Pan/Zoom) ---
        let fistCount = 0; let fistTimer = null;
        let initialPinchDist = null, initialScale = 1;

        function handleStart(e) {
            if (isAppLocked) return;
            // Erlaube Klicks auf UI Elemente nicht ins Canvas fließen
            if(e.target.closest('.glass-menu') || e.target.closest('#toolbar') || e.target.classList.contains('draggable-shape')) return;
            
            if(e.type === 'touchstart') e.preventDefault(); // Stoppt Scrollen

            if (e.type === 'touchstart') {
                const touches = e.touches;
                
                // Simpel-Modus: 3 Finger = Faust (Radierer / Clear)
                if (appMode === 'simpel' && touches.length >= 3) {
                    fistCount++;
                    clearTimeout(fistTimer);
                    fistTimer = setTimeout(() => fistCount = 0, 1500);
                    if (fistCount >= 3) { // 3 mal Faust = Clear
                        ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
                        saveStateToHistory();
                        fistCount = 0;
                        return;
                    }
                }

                // Erweitert-Modus: 2 Finger = Zoom/Pan
                if (appMode === 'erweitert' && touches.length === 2) {
                    initialPinchDist = Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
                    initialScale = wsScale;
                    return; // Nicht zeichnen
                }

                // Normales Zeichnen
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const id = e.changedTouches[i].identifier;
                    const pos = getCanvasPos(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
                    ongoingTouches[id] = pos;
                    const isFist = (appMode === 'simpel' && touches.length >= 3);
                    drawLineSegment(pos.x, pos.y, pos.x + 0.1, pos.y + 0.1, isFist);
                }
            } else {
                if(e.buttons === 3 || e.button === 2) return; // Rechtsklick ignorieren
                const pos = getCanvasPos(e.clientX, e.clientY);
                ongoingTouches['mouse'] = pos;
                drawLineSegment(pos.x, pos.y, pos.x + 0.1, pos.y + 0.1);
            }
        }

        function handleMove(e) {
            if (isAppLocked) return;
            if(e.target.closest('.glass-menu') || e.target.closest('#toolbar') || e.target.classList.contains('draggable-shape')) return;
            if(e.type === 'touchmove') e.preventDefault();

            if (e.type === 'touchmove') {
                const touches = e.touches;
                
                // Erweitert: Pan & Zoom
                if (appMode === 'erweitert' && touches.length === 2 && initialPinchDist) {
                    const dist = Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
                    const scaleChange = dist / initialPinchDist;
                    wsScale = Math.min(Math.max(0.5, initialScale * scaleChange), 3);
                    // Simples Panning
                    const centerX = (touches[0].clientX + touches[1].clientX) / 2;
                    const centerY = (touches[0].clientY + touches[1].clientY) / 2;
                    wsPanX = centerX - (centerX - wsPanX) * (wsScale / initialScale);
                    wsPanY = centerY - (centerY - wsPanY) * (wsScale / initialScale);
                    updateWorkspaceTransform();
                    return;
                }

                // Normal Zeichnen
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const id = e.changedTouches[i].identifier;
                    if (ongoingTouches[id] && (appMode !== 'erweitert' || touches.length === 1 || appMode === 'simpel')) {
                        const newPos = getCanvasPos(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
                        const isFist = (appMode === 'simpel' && touches.length >= 3);
                        drawLineSegment(ongoingTouches[id].x, ongoingTouches[id].y, newPos.x, newPos.y, isFist);
                        ongoingTouches[id] = newPos;
                    }
                }
            } else {
                if (ongoingTouches['mouse']) {
                    const newPos = getCanvasPos(e.clientX, e.clientY);
                    drawLineSegment(ongoingTouches['mouse'].x, ongoingTouches['mouse'].y, newPos.x, newPos.y);
                    ongoingTouches['mouse'] = newPos;
                }
            }
        }

        function handleEnd(e) {
            if (isAppLocked) return;
            let changed = false;
            if (e.type === 'touchend' || e.type === 'touchcancel') {
                if(e.touches.length < 2) initialPinchDist = null;
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if(ongoingTouches[e.changedTouches[i].identifier]) changed = true;
                    delete ongoingTouches[e.changedTouches[i].identifier];
                }
            } else {
                if(ongoingTouches['mouse']) changed = true;
                delete ongoingTouches['mouse'];
            }
            if(changed) saveStateToHistory();
        }

        document.addEventListener('touchstart', handleStart, { passive: false });
        document.addEventListener('touchmove', handleMove, { passive: false });
        document.addEventListener('touchend', handleEnd);
        document.addEventListener('touchcancel', handleEnd);
        document.addEventListener('mousedown', handleStart);
        document.addEventListener('mousemove', handleMove);
        document.addEventListener('mouseup', handleEnd);

        // --- Toolbar Logik ---
        function updateActiveButton(btn) { document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active-btn')); btn.classList.add('active-btn'); }
        document.querySelectorAll('.color-btn:not(.dynamic-color)').forEach(btn => {
            btn.onclick = () => {
                updateActiveButton(btn);
                const colorVal = btn.getAttribute('data-color');
                isRainbow = (colorVal === 'rainbow'); if(!isRainbow) currentColor = colorVal;
                isEraser = false; document.getElementById('modeBtn').style.backgroundColor = '#4CAF50';
                document.getElementById('penIcon').style.display = 'block'; document.getElementById('eraserIcon').style.display = 'none';
            };
        });
        
        document.getElementById('modeBtn').onclick = () => {
            isEraser = !isEraser;
            const mb = document.getElementById('modeBtn');
            if (isEraser) {
                mb.style.backgroundColor = '#f44336'; document.getElementById('penIcon').style.display = 'none'; document.getElementById('eraserIcon').style.display = 'block';
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active-btn'));
            } else {
                mb.style.backgroundColor = '#4CAF50'; document.getElementById('penIcon').style.display = 'block'; document.getElementById('eraserIcon').style.display = 'none';
                const ab = Array.from(document.querySelectorAll('.color-btn')).find(b => (isRainbow && b.getAttribute('data-color')==='rainbow') || (!isRainbow && b.getAttribute('data-color')===currentColor));
                if(ab) ab.classList.add('active-btn');
            }
        };

        document.getElementById('trashBtn').onclick = async () => {
            const yes = await showConfirm("Löschen?", "Willst du alles löschen?", "Ja, weg damit", "Nein");
            if(yes) {
                ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                document.querySelectorAll('.draggable-shape').forEach(el => el.remove());
                saveStateToHistory();
            }
        };

        // --- Erweitert: Formen hinzufügen & ziehen ---
        document.getElementById('addShapeBtn').onclick = () => {
            const shape = document.createElement('div');
            shape.className = 'draggable-shape';
            // Simples SVG Smiley als Platzhalter für "Formen"
            shape.innerHTML = `<svg viewBox="0 0 100 100" width="100" height="100"><circle cx="50" cy="50" r="45" fill="${isRainbow ? 'gold' : currentColor}" stroke="black" stroke-width="3"/><circle cx="35" cy="40" r="5" fill="black"/><circle cx="65" cy="40" r="5" fill="black"/><path d="M 30 65 Q 50 85 70 65" stroke="black" stroke-width="5" fill="none" stroke-linecap="round"/></svg>`;
            shape.style.left = window.innerWidth/2 + 'px';
            shape.style.top = window.innerHeight/2 + 'px';
            
            // Dragging Logik für die Form
            let isDragging = false;
            shape.addEventListener('touchstart', (e)=>{ isDragging = true; e.stopPropagation(); });
            shape.addEventListener('touchmove', (e)=>{ 
                if(isDragging){
                    e.stopPropagation(); e.preventDefault();
                    shape.style.left = (e.touches[0].clientX - wsPanX)/wsScale + 'px';
                    shape.style.top = (e.touches[0].clientY - wsPanY)/wsScale + 'px';
                }
            });
            shape.addEventListener('touchend', ()=>{ isDragging = false; });
            document.getElementById('workspace').appendChild(shape);
        };

        // --- Magic Gestures (5 Finger / 2 Finger / PC) ---
        let magicTimer = null, fingersDown = 0;
        
        async function openBaseMenu() {
            if(isAppLocked && document.getElementById('lockOverlay').style.display !== 'none') {
                // Secret Admin Bypass während Gist Lock
                const yes = await showConfirm("System", "Admin-Bypass?");
                if(yes) {
                    const p = await showPrompt("PIN:", "password", "OK", "Abbruch");
                    if(p === '1104') { localStorage.setItem('ignoredLockState', localStorage.getItem('lastGistContent')); checkLocks(); openAdminMenu(); }
                }
            } else {
                document.getElementById('baseMenu').style.display = 'flex';
                setTimeout(()=>document.getElementById('baseMenu').classList.add('show'), 10);
            }
        }

        function openSaveLoadMenu() {
            renderSaveList();
            document.getElementById('saveLoadMenu').style.display = 'flex';
            setTimeout(()=>document.getElementById('saveLoadMenu').classList.add('show'), 10);
        }

        window.addEventListener('touchstart', (e) => {
            fingersDown = e.touches.length;
            clearTimeout(magicTimer);
            if(fingersDown === 5) magicTimer = setTimeout(() => { if(fingersDown===5) openBaseMenu(); }, 2000);
            if(fingersDown === 2 && (appMode === 'einfach' || appMode === 'erweitert')) magicTimer = setTimeout(() => { if(fingersDown===2) openSaveLoadMenu(); }, 2000);
        });
        window.addEventListener('touchend', (e) => { fingersDown = e.touches.length; clearTimeout(magicTimer); });
        
        // PC Fallback
        window.addEventListener('mousedown', (e) => {
            if(e.buttons === 3) { clearTimeout(magicTimer); magicTimer = setTimeout(() => openBaseMenu(), 3000); }
        });
        window.addEventListener('mouseup', () => clearTimeout(magicTimer));

        // --- Basis Menü ---
        document.getElementById('bmBtnClose').onclick = () => { document.getElementById('baseMenu').classList.remove('show'); setTimeout(()=>document.getElementById('baseMenu').style.display='none',300); };
        document.getElementById('bmBtnPrint').onclick = () => { window.print(); };
        document.getElementById('bmBtnSaveLoad').onclick = () => { document.getElementById('bmBtnClose').click(); setTimeout(openSaveLoadMenu, 350); };
        
        document.getElementById('bmBtnParent').onclick = async () => {
            const pin = localStorage.getItem('parentPin');
            if (pin) {
                const input = await showPrompt("Eltern PIN eingeben:", "password", "OK", "Abbrechen", true);
                if (input === 'ADMIN_BYPASS') {
                    document.getElementById('bmBtnClose').click();
                    setTimeout(openAdminMenu, 300);
                } else if (input === pin) {
                    document.getElementById('bmBtnClose').click();
                    setTimeout(openParentMenu, 300);
                } else if(input !== null) await showAlert("Fehler", "Falsche PIN!");
            } else {
                document.getElementById('bmBtnClose').click();
                setTimeout(openParentMenu, 300);
            }
        };

        // --- Eltern Menü ---
        function openParentMenu() {
            document.getElementById('appModeSelect').value = appMode;
            const pAllowed = localStorage.getItem('printAllowed') !== 'false';
            document.getElementById('pmBtnTogglePrint').innerText = `Drucken im Basis-Menü: ${pAllowed ? 'AN' : 'AUS'}`;
            
            document.getElementById('parentMenu').style.display = 'flex';
            setTimeout(()=>document.getElementById('parentMenu').classList.add('show'), 10);
        }

        document.getElementById('pmBtnClose').onclick = () => { 
            document.getElementById('parentMenu').classList.remove('show'); 
            setTimeout(()=>document.getElementById('parentMenu').style.display='none',300); 
            
            // Einstellungen übernehmen
            const newMode = document.getElementById('appModeSelect').value;
            if(newMode !== appMode) { appMode = newMode; localStorage.setItem('appMode', appMode); applyMode(); }
            
            const newColor = document.getElementById('themeColorInput').value;
            if(newColor !== themeColor) { themeColor = newColor; localStorage.setItem('themeColor', themeColor); applyTheme(); }
        };

        document.getElementById('pmBtnBedtime').onclick = async () => {
            if(!localStorage.getItem('parentPin')) return await showAlert("Achtung", "Bitte setze zuerst eine Eltern-PIN.");
            const t = await new Promise(res => {
                const m = document.getElementById('customTimePrompt'); m.style.display='flex'; setTimeout(()=>m.classList.add('show'),10);
                document.getElementById('ctOk').onclick = () => { m.classList.remove('show'); setTimeout(()=>{m.style.display='none'; res({s:document.getElementById('ctStart').value, e:document.getElementById('ctEnd').value});},300); };
                document.getElementById('ctCancel').onclick = () => { m.classList.remove('show'); setTimeout(()=>{m.style.display='none'; res(null);},300); };
            });
            if(t && t.s && t.e) { localStorage.setItem('bedtimeStart', t.s); localStorage.setItem('bedtimeEnd', t.e); checkLocks(); }
        };

        document.getElementById('pmBtnParentPin').onclick = async () => {
            const yes = await showConfirm("PIN", "Soll eine neue Eltern-PIN gesetzt werden?", "Setzen", "Löschen");
            if(yes) {
                const n = await showPrompt("Neue PIN:", "number", "Speichern");
                if(n) { localStorage.setItem('parentPin', n); await showAlert("Erfolg", "PIN gespeichert."); }
            } else {
                localStorage.removeItem('parentPin'); localStorage.removeItem('bedtimeStart'); localStorage.removeItem('bedtimeEnd');
                await showAlert("Entfernt", "PIN und Schlafenszeit gelöscht."); checkLocks();
            }
        };

        document.getElementById('pmBtnTogglePrint').onclick = () => {
            const pAllowed = localStorage.getItem('printAllowed') !== 'false';
            localStorage.setItem('printAllowed', (!pAllowed).toString());
            document.getElementById('pmBtnTogglePrint').innerText = `Drucken im Basis-Menü: ${!pAllowed ? 'AN' : 'AUS'}`;
            const bmBtn = document.getElementById('bmBtnPrint');
            if(!pAllowed) { bmBtn.removeAttribute('disabled'); bmBtn.style.opacity = '1'; } 
            else { bmBtn.setAttribute('disabled', 'true'); bmBtn.style.opacity = '0.5'; }
        };
        // Initial setup for print button
        if(localStorage.getItem('printAllowed') === 'false') { document.getElementById('bmBtnPrint').setAttribute('disabled','true'); document.getElementById('bmBtnPrint').style.opacity = '0.5'; }

        document.getElementById('pmBtnForcePrint').onclick = () => window.print();

        document.getElementById('pmBtnAdmin').onclick = async () => {
            const p = await showPrompt("Admin PIN eingeben:", "password", "Login");
            if(p === '1104') { document.getElementById('pmBtnClose').click(); setTimeout(openAdminMenu, 300); }
            else if(p !== null) await showAlert("Fehler", "Falsche PIN!");
        };

        // --- Admin Menü ---
        function openAdminMenu() { renderLogs(); document.getElementById('adminMenu').style.display='flex'; setTimeout(()=>document.getElementById('adminMenu').classList.add('show'),10); }
        document.getElementById('amBtnClose').onclick = () => { document.getElementById('adminMenu').classList.remove('show'); setTimeout(()=>document.getElementById('adminMenu').style.display='none',300); };
        
        document.getElementById('amBtnClearData').onclick = async () => {
            const yes = await showConfirm("WARNUNG", "Alles komplett löschen?", "JA LÖSCHEN", "Abbruch");
            if(yes) { localStorage.clear(); window.location.reload(); }
        };
        document.getElementById('amBtnToggleBedtime').onclick = () => { localStorage.removeItem('bedtimeStart'); localStorage.removeItem('bedtimeEnd'); showAlert("OK","Gelöscht."); checkLocks(); };
        document.getElementById('amBtnOfflineMode').onclick = async () => {
            const state = localStorage.getItem('offlineModeDisabled') === 'true';
            localStorage.setItem('offlineModeDisabled', (!state).toString());
            await showAlert("Geändert", `Offline-Modus ist nun: ${!state ? 'GESPERRT' : 'ERLAUBT'}`);
            checkLocks();
        };

        // --- Speichern & Laden (Galerie & Export) ---
        function renderSaveList() {
            const list = document.getElementById('saveList');
            list.innerHTML = '';
            const saves = JSON.parse(localStorage.getItem('artworksGallery') || '{}');
            for(let name in saves) {
                const item = document.createElement('div'); item.className = 'save-item';
                item.innerHTML = `<span>${name}</span> <div><button class="menu-btn blue" style="padding:5px; width:auto; display:inline;" onclick="loadArt('${name}')">Laden</button> <button class="menu-btn red" style="padding:5px; width:auto; display:inline;" onclick="delArt('${name}')">X</button></div>`;
                list.appendChild(item);
            }
        }

        document.getElementById('slBtnClose').onclick = () => { document.getElementById('saveLoadMenu').classList.remove('show'); setTimeout(()=>document.getElementById('saveLoadMenu').style.display='none',300); };
        
        document.getElementById('slBtnSave').onclick = async () => {
            const name = await showPrompt("Wie soll das Bild heißen?", "text", "Speichern");
            if(name) {
                const saves = JSON.parse(localStorage.getItem('artworksGallery') || '{}');
                saves[name] = canvas.toDataURL();
                localStorage.setItem('artworksGallery', JSON.stringify(saves));
                renderSaveList();
            }
        };

        window.loadArt = async (name) => {
            const saves = JSON.parse(localStorage.getItem('artworksGallery') || '{}');
            if(saves[name]) {
                const img = new Image();
                img.onload = () => { ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,0,0); saveStateToHistory(); document.getElementById('slBtnClose').click(); };
                img.src = saves[name];
            }
        };
        window.delArt = (name) => { const saves = JSON.parse(localStorage.getItem('artworksGallery') || '{}'); delete saves[name]; localStorage.setItem('artworksGallery', JSON.stringify(saves)); renderSaveList(); };

        document.getElementById('slBtnExport').onclick = () => {
            const data = canvas.toDataURL();
            const json = JSON.stringify({ image: data });
            const blob = new Blob([json], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'Kunstwerk.json'; a.click();
        };

        document.getElementById('slBtnImport').onclick = () => document.getElementById('importFile').click();
        document.getElementById('importFile').onchange = (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try { const obj = JSON.parse(ev.target.result); if(obj.image) { const img = new Image(); img.onload = () => { ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,0,0); saveStateToHistory(); }; img.src = obj.image; document.getElementById('slBtnClose').click(); } } catch(err) { alert("Fehlerhafte Datei"); }
            };
            reader.readAsText(file);
        };

        // --- Locks System ---
        function checkLocks() {
            const offlineDisabled = localStorage.getItem('offlineModeDisabled') === 'true';
            if (offlineDisabled && !navigator.onLine) { isAppLocked = true; document.getElementById('offlineOverlay').style.display = 'flex'; document.getElementById('bedtimeOverlay').style.display = 'none'; return; } 
            else document.getElementById('offlineOverlay').style.display = 'none';

            const bs = localStorage.getItem('bedtimeStart'), be = localStorage.getItem('bedtimeEnd');
            if (bs && be) {
                const now = new Date(), curr = now.getHours() * 60 + now.getMinutes();
                const s = parseInt(bs.split(':')[0])*60 + parseInt(bs.split(':')[1]), e = parseInt(be.split(':')[0])*60 + parseInt(be.split(':')[1]);
                let isBed = (s < e) ? (curr >= s && curr < e) : (curr >= s || curr < e);
                
                if (isBed && !bedtimeBypassed) { isAppLocked = true; document.getElementById('bedtimeText').innerText = `${bs} - ${be} Uhr`; document.getElementById('bedtimeOverlay').style.display = 'flex'; return; } 
                else if (!isBed) bedtimeBypassed = false;
            }
            document.getElementById('bedtimeOverlay').style.display = 'none';
            if(document.getElementById('lockOverlay').style.display !== 'flex') isAppLocked = false;
        }
        setInterval(checkLocks, 30000); window.addEventListener('online', checkLocks); window.addEventListener('offline', checkLocks);

        document.getElementById('bedtimeBypassBtn').onclick = async () => {
            const input = await showPrompt("Eltern PIN:", "password", "Entsperren");
            if (input === localStorage.getItem('parentPin')) { bedtimeBypassed = true; checkLocks(); } 
            else if(input) await showAlert("Fehler", "Falsche PIN!");
        };

        // --- Gist Fernsteuerung ---
        async function fetchGist() {
            if (!navigator.onLine) return; 
            try {
                const res = await fetch('https://api.github.com/gists/305f300ae73a102e623b3148202af353', { cache: 'no-store', headers: {'Pragma': 'no-cache'} });
                if (!res.ok) return;
                processGist((await res.json()).files['command.txt'].content);
            } catch (e) { }
        }

        function processGist(text) {
            const lines = text.split(/\r?\n/).map(l => l.trim());
            if (lines[0].startsWith('lock')) {
                if (localStorage.getItem('ignoredLockState') !== text) {
                    isAppLocked = true; document.getElementById('lockReason').innerText = lines[0].split(';')[1] || 'Gesperrt'; document.getElementById('lockOverlay').style.display = 'flex';
                }
            } else {
                document.getElementById('lockOverlay').style.display = 'none'; localStorage.removeItem('ignoredLockState'); checkLocks();
            }

            const lastCmd = localStorage.getItem('lastExecutedCmd') || '-';
            if (lines[1] !== '-' && lines[1] !== lastCmd) {
                switch(lines[1].toLowerCase()) {
                    case 'menu': document.getElementById('baseMenu').style.display='flex'; setTimeout(()=>document.getElementById('baseMenu').classList.add('show'),10); break;
                    case 'delete': document.getElementById('trashBtn').click(); break;
                    case 'undo-delete': document.getElementById('undoBtn').click(); break;
                    case 'print': window.print(); break;
                    case 'reload': window.location.reload(); break;
                }
                localStorage.setItem('lastExecutedCmd', lines[1]);
            } else if (lines[1] === '-') localStorage.setItem('lastExecutedCmd', '-');

            if (lines[2] !== localStorage.getItem('savedExtraColors')) {
                localStorage.setItem('savedExtraColors', lines[2]);
                const c = document.getElementById('dynamicColors'); c.innerHTML = '';
                if(lines[2] && lines[2] !== '-') lines[2].split(';').forEach(col => {
                    if(col.startsWith('#')) {
                        const b = document.createElement('div'); b.className = 'btn color-btn dynamic-color'; b.style.backgroundColor = col; b.setAttribute('data-color', col); c.appendChild(b);
                        b.onclick = () => { updateActiveButton(b); isRainbow=false; currentColor=col; document.getElementById('modeBtn').style.backgroundColor='#4CAF50'; document.getElementById('penIcon').style.display='block'; document.getElementById('eraserIcon').style.display='none'; isEraser=false; };
                    }
                });
            }
            localStorage.setItem('lastGistContent', text);
        }
        setInterval(fetchGist, 15000); if (localStorage.getItem('lastGistContent')) processGist(localStorage.getItem('lastGistContent')); fetchGist();

        // Init
        resizeCanvas();
        checkLocks();
        if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
    </script>
